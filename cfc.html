    </div>}
    {selAct&&<ActividadDetalle a={selAct} contactos={contactos} empresas={empresas} oportunidades={[o]} catalogos={catalogos} onClose={()=>setSelAct(null)} onEdit={onEditAct?()=>{const x=selAct;setSelAct(null);onEditAct(x);}:undefined}/>}
  </div>;
}

function Oportunidades({oportunidades,contactos,empresas,aliados,catalogos,actividades,productos,openOpo,openAct,onToggleFav}){
  const[fEts,setFEts]=useState([]);
  const toggleEt=(v)=>setFEts(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v]);
  const[showFil,setShowFil]=useState(false);
  const[fSol,setFSol]=useState([]);
  const[fContacto,setFContacto]=useState("");
  const[fEmpresa,setFEmpresa]=useState("");
  const[fAliado,setFAliado]=useState("");
  const[fProb,setFProb]=useState([]);
  const[fRecur,setFRecur]=useState([]);
  const[cDesde,setCDesde]=useState("");
  const[cHasta,setCHasta]=useState("");
  const[q,setQ]=useState("");
  const[fSinAct,setFSinAct]=useState(false);
  const[fDestacadas,setFDestacadas]=useState(false);
  const[fFavOpo,setFFavOpo]=useState(false);
  const[fAlineado,setFAlineado]=useState(false);
  const[mesAlineado,setMesAlineado]=useState(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");});
  const[showObjetivo,setShowObjetivo]=useState(false);
  const[ord,setOrd]=useState("etapa");
  const[ordDir,setOrdDir]=useState("asc");
  const solName=(id)=>(((catalogos&&catalogos.solucion)||[]).find(s=>s.id===id)||{}).nombre||"";
  const cn=(id)=>(contactos.find(c=>c.id===id)||{}).nombreCompleto||"";
  const en=(id)=>(empresas.find(e=>e.id===id)||{}).nombre||"";
  const toggleSol=(id)=>setFSol(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleProb=(v)=>setFProb(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v]);
  const toggleRecur=(v)=>setFRecur(p=>p.includes(v)?p.filter(x=>x!==v):[...p,v]);
  // ── Cómputo de oportunidades sin seguimiento activo ──
  const actActivas=(actividades||[]).filter(a=>a.estatus==="Programada"||a.estatus==="En Proceso");
  const tieneSeg=(o)=>{
    const opIds=o.contactosOperativosIds||[o.contactoOperativoId].filter(Boolean);
    return actActivas.some(a=>
      a.oportunidadId===o.id ||
      (a.contactoId&&(
        a.contactoId===(o.contactoPrincipalId||o.contactoId)||
        opIds.includes(a.contactoId)
      ))
    );
  };
  const abiertas=oportunidades.filter(ABIERTA);
  const sinSeguimiento=abiertas.filter(o=>!tieneSeg(o));
  // solIdsConMeta debe declararse ANTES del filter de list
  const solIdsConMeta=new Set((productos||[]).filter(p=>Number((p.metas||{})[mesAlineado])>0).map(p=>p.solucionId));
  const ql=q.trim().toLowerCase();
  const list=oportunidades.filter(o=>{
    // Filtro base: excluir Concretadas/Rechazadas/En Espera a menos que el usuario las seleccione explícitamente
    const userPickedClosed=fEts.length>0&&fEts.some(et=>!ABIERTA({etapa:et}));
    if(!userPickedClosed&&!ABIERTA(o))return false;
    if(fSinAct&&tieneSeg(o))return false;
    if(fSinAct&&!ABIERTA(o))return false;
    if(fFavOpo&&!o.fav)return false;
    if(fAlineado){if(!ABIERTA(o)||!solIdsConMeta.has(o.solucionId)||(o.fechaEstimadaCierre||"").slice(0,7)!==mesAlineado)return false;}
    if(fDestacadas){const sol=(catalogos.solucion||[]).find(s=>s.id===o.solucionId);if(!sol?.ancla||!ABIERTA(o))return false;}
    if(fEts.length>0&&!fEts.includes(o.etapa||""))return false;
    if(fSol.length&&!fSol.includes(o.solucionId))return false;
    if(fContacto&&(o.contactoPrincipalId||o.contactoId)!==fContacto&&o.contactoOperativoId!==fContacto)return false;
    if(fEmpresa&&o.empresaId!==fEmpresa)return false;
    if(fAliado&&o.aliadoEstrategicoId!==fAliado&&o.aliadoComercialId!==fAliado)return false;
    if(fProb.length&&!fProb.includes(o.probabilidad))return false;
    if(fRecur.length&&!fRecur.includes(o.recurrencia||"Única"))return false;
    if(cDesde&&(o.fechaEstimadaCierre||"")<cDesde)return false;
    if(cHasta&&(o.fechaEstimadaCierre||"")>cHasta)return false;
    if(ql){const hay=[o.concepto,cn(o.contactoPrincipalId||o.contactoId),cn(o.contactoOperativoId),en(o.empresaId),solName(o.solucionId)].filter(Boolean).join(" ").toLowerCase();if(!hay.includes(ql))return false;}
    return true;
  }).sort((a,b)=>{
    const PROB_RANK={"Muy Alta":0,"Alta":1,"Media":2,"Baja":3};
    const etapas=(catalogos.etapaOportunidad||[]).map(e=>e.nombre);
    let r=0;
    if(ord==="etapa"){
      r=(etapas.indexOf(a.etapa)>-1?etapas.indexOf(a.etapa):99)-(etapas.indexOf(b.etapa)>-1?etapas.indexOf(b.etapa):99);
      if(r===0)r=((PROB_RANK[a.probabilidad]??9)-(PROB_RANK[b.probabilidad]??9));
      if(r===0)r=(a.fechaEstimadaCierre||"9999").localeCompare(b.fechaEstimadaCierre||"9999");
    }
    else if(ord==="cierre") r=(a.fechaEstimadaCierre||"9999").localeCompare(b.fechaEstimadaCierre||"9999");
    else if(ord==="prob")   r=((PROB_RANK[a.probabilidad]??9)-(PROB_RANK[b.probabilidad]??9));
    else if(ord==="monto")  r=((Number(b.comisionEstimada)||Number(b.montoEstimado)||0))-((Number(a.comisionEstimada)||Number(a.montoEstimado)||0));
    return ordDir==="asc"?r:-r;
  });
  const nFil=(fEts.length?1:0)+(fSol.length?1:0)+(fContacto?1:0)+(fEmpresa?1:0)+(fAliado?1:0)+(fProb.length?1:0)+(fRecur.length?1:0)+((cDesde||cHasta)?1:0)+(fSinAct?1:0)+(fDestacadas?1:0)+(fAlineado?1:0)+(fFavOpo?1:0);
  const limpiar=()=>{setFEts([]);setFSol([]);setFContacto("");setFEmpresa("");setFAliado("");setFProb([]);setFRecur([]);setCDesde("");setCHasta("");setQ("");setFSinAct(false);setFDestacadas(false);setFAlineado(false);setFFavOpo(false);};
  const alineadasCount=(oportunidades||[]).filter(o=>ABIERTA(o)&&solIdsConMeta.has(o.solucionId)&&(o.fechaEstimadaCierre||"").slice(0,7)===mesAlineado).length;
  const destacadasCount=(oportunidades||[]).filter(o=>ABIERTA(o)&&(catalogos.solucion||[]).find(s=>s.id===o.solucionId)?.ancla).length;
  const aliadoOpts=(aliados||[]).map(a=>({id:a.id,label:nombreDisplay(a)}));
  return <div>
    <div style={S.hdr}><div><div style={S.logo}>Oportunidades</div></div></div>
    <div style={S.line}/>
    <div style={S.sec}>
      {/* Comisión esperada — compacta, con conteo inline */}
      <div style={{...S.card(),padding:"8px 12px",marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:8,color:"#64748b",fontWeight:700,letterSpacing:.5}}>COMISIÓN ESPERADA{(fAlineado||fDestacadas||fFavOpo||fEts.length||fSol.length||fSinAct)?" · FILTRADO":""}</div>
            <div style={{fontSize:18,fontWeight:800,color:GOLD}}>{money(list.reduce((s,o)=>s+(Number(o.comisionEstimada)||0),0))}</div>
          </div>
          <div style={{textAlign:"right",fontSize:9,color:"#475569"}}>{list.length} en vista</div>
        </div>
      </div>
      {/* Búsqueda + filtros elaborados */}
      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
        <input style={{...S.inp,flex:1}} placeholder="🔍 Buscar concepto, contacto, empresa…" value={q} onChange={e=>setQ(e.target.value)}/>
        <button style={{...S.pill(showFil||nFil>0,"#2dd4bf"),padding:"0 12px",fontWeight:700,whiteSpace:"nowrap",fontSize:11}} onClick={()=>setShowFil(v=>!v)}>⚙{nFil>0?` (${nFil})`:""}</button>
      </div>
      {/* Orden — chips pequeños */}
      <div style={{display:"flex",gap:4,marginBottom:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:8,color:"#64748b",fontWeight:700,flexShrink:0}}>ORDEN</span>
        {[["etapa","Etapa"],["cierre","Cierre"],["prob","Prob."],["monto","Monto"]].map(([v,l])=>(
          <span key={v} style={{...S.chip(ord===v,GOLD),fontSize:9,padding:"2px 7px",whiteSpace:"nowrap",cursor:"pointer"}} onClick={()=>setOrd(v)}>{l}</span>
        ))}
        <span style={{...S.chip(false,"#64748b"),fontSize:9,padding:"2px 7px",cursor:"pointer"}} onClick={()=>setOrdDir(d=>d==="asc"?"desc":"asc")}>{ordDir==="asc"?"↑":"↓"}</span>
      </div>
      {/* Filtros rápidos — chips con labels descriptivos en una sola línea */}
      <div style={{display:"flex",gap:5,marginBottom:8,alignItems:"center",flexWrap:"nowrap",overflowX:"auto"}}>
        {(oportunidades||[]).filter(o=>o.fav).length>0&&<span style={{...S.chip(fFavOpo,"#fbbf24"),fontSize:9,padding:"3px 8px",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}} onClick={()=>setFFavOpo(v=>!v)}>⭐ Mis favoritas{fFavOpo?` (${(oportunidades||[]).filter(o=>o.fav).length})`:""}</span>}
        {destacadasCount>0&&<span style={{...S.chip(fDestacadas,GOLD),fontSize:9,padding:"3px 8px",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}} onClick={()=>setFDestacadas(v=>!v)}>★ Destacadas{fDestacadas?` (${destacadasCount})`:""}</span>}
        <span style={{...S.chip(fAlineado,"#22c55e"),fontSize:9,padding:"3px 8px",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}} onClick={()=>setFAlineado(v=>!v)}>🎯 Objetivo{fAlineado&&alineadasCount>0?` (${alineadasCount})`:""}</span>
        <input type="month" style={{background:"#13131f",border:`1px solid ${fAlineado?"#22c55e":"#1e293b"}`,borderRadius:8,padding:"2px 5px",color:"#e2e8f0",fontSize:9,outline:"none",width:100,flexShrink:0}} value={mesAlineado} onChange={e=>setMesAlineado(e.target.value)}/>
        {sinSeguimiento.length>0&&<span style={{...S.chip(fSinAct,"#ef4444"),fontSize:9,padding:"3px 8px",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}} onClick={()=>setFSinAct(v=>!v)}>⚠ Sin actividad{fSinAct?` (${sinSeguimiento.length})`:""}</span>}
      </div>
      {/* Objetivo del Mes — colapsable */}
      <div style={{marginBottom:8}}>
        <button style={{...S.chip(showObjetivo,"#a78bfa"),fontSize:9,padding:"3px 10px",width:"100%",cursor:"pointer",textAlign:"center"}} onClick={()=>setShowObjetivo(v=>!v)}>🎯 Objetivo del Mes {showObjetivo?"▲":"▾"}</button>
        {showObjetivo&&<div style={{marginTop:6}}><ObjetivoMes productos={productos} oportunidades={oportunidades} catalogos={catalogos}/></div>}
      </div>
      {/* Panel de filtros elaborados */}
      {showFil&&<div style={{...S.card(),marginBottom:8}}>
        <div style={S.fl}>Etapa</div>
        <div style={{...S.chips,flexWrap:"wrap",overflowX:"visible"}}>
          {fEts.length>0&&<span style={{...S.chip(false,"#64748b"),fontSize:9,padding:"3px 8px"}} onClick={()=>setFEts([])}>✕ Todas</span>}
          {(catalogos.etapaOportunidad||[]).map(o=><span key={o.id} style={S.chip(fEts.includes(o.nombre),oc(o.nombre))} onClick={()=>toggleEt(o.nombre)}>{o.nombre.replace("Oportunidad ","")}</span>)}
        </div>
        <div style={{...S.fl,marginTop:10}}>Probabilidad</div>
        <div style={{...S.chips,flexWrap:"wrap",overflowX:"visible"}}>
          {PROB.map(p=><span key={p} style={S.chip(fProb.includes(p),PROB_COLOR[p])} onClick={()=>toggleProb(p)}>{p}</span>)}
        </div>
        <div style={{...S.fl,marginTop:10}}>Recurrencia</div>
        <div style={{...S.chips,flexWrap:"wrap",overflowX:"visible"}}>
          {RECUR.map(r=><span key={r} style={S.chip(fRecur.includes(r),"#a78bfa")} onClick={()=>toggleRecur(r)}>{r}</span>)}
        </div>
        <div style={{...S.fl,marginTop:10}}>Solución</div>
        <div style={{...S.chips,flexWrap:"wrap",overflowX:"visible"}}>{(catalogos.solucion||[]).map(s=><span key={s.id} style={S.chip(fSol.includes(s.id),GOLD)} onClick={()=>toggleSol(s.id)}>{s.nombre}</span>)}</div>
        <div style={{...S.fl,marginTop:10}}>Contacto</div>
        <BuscaSelect opciones={contactos.slice().sort((a,b)=>(a.nombreCompleto||"").localeCompare(b.nombreCompleto||"")).map(c=>({id:c.id,label:nombreDisplay(c)}))} value={fContacto} onChange={v=>setFContacto(v)} placeholder="— Cualquiera —" vacioLabel="— Cualquiera —"/>
        <div style={{...S.fl,marginTop:10}}>Empresa</div>
        <BuscaSelect opciones={empresas.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).map(e=>({id:e.id,label:e.nombre}))} value={fEmpresa} onChange={v=>setFEmpresa(v)} placeholder="— Cualquiera —" vacioLabel="— Cualquiera —"/>
        <div style={{...S.fl,marginTop:10}}>Aliado</div>
        <BuscaSelect opciones={aliadoOpts} value={fAliado} onChange={v=>setFAliado(v)} placeholder="— Cualquiera —" vacioLabel="— Cualquiera —"/>
        <div style={S.g2}>
          <div><div style={{...S.fl,marginTop:10}}>Cierre desde</div><input type="date" style={S.inp} value={cDesde} onChange={e=>{setCDesde(e.target.value);if(e.target.value&&!cHasta)setCHasta(e.target.value);}}/></div>
          <div><div style={{...S.fl,marginTop:10}}>Cierre hasta</div><input type="date" style={S.inp} value={cHasta} onChange={e=>setCHasta(e.target.value)}/></div>
        </div>
        {nFil>0&&<div style={{textAlign:"right",marginTop:10}}><button style={S.pill(false,"#f87171")} onClick={limpiar}>Limpiar filtros</button></div>}
      </div>}
    </div>
    <div style={{...S.sec,paddingTop:4}}>
      {list.map(o=><OpoCard key={o.id} o={o} contactos={contactos} empresas={empresas} catalogos={catalogos} actividades={actividades} sinAct={ABIERTA(o)&&!tieneSeg(o)} onTap={(x)=>openOpo(x,x.contactoId)} onToggleFav={onToggleFav} onEditAct={openAct?(x)=>openAct(x,x.contactoId):undefined}/>)}
      {list.length===0&&<div style={{textAlign:"center",color:"#475569",fontSize:12,padding:"30px 0"}}>Sin oportunidades.</div>}
    </div>
    <button style={S.fab} onClick={()=>openOpo({},null)}>+</button>
  </div>;
}

/* ════════ APP ════════ */
function App(){
  const[view,setView]=useState("inicio");
  const[contactos,setContactos]=useState(()=>{
    let cs=migra(loadLS("contactos",null)||SEED.contactos);
    if(!localStorage.getItem(PFX+"migAnclaCto")){ const _M={"Est Fiscal":"sol2","Fianzas":"sol6","Less Salt":"sol20","Regulacion PLD":"sol8","Gestion Financiamiento":"sol7","Seguro Flotillas":"sol4","Consultoria Seguridad":"sol15","Seguro Vida":"sol3"}; cs=cs.map(c=>({...c,solucionesAncla:(c.solucionesAncla||[]).map(v=>_M[v]||v)})); try{localStorage.setItem(PFX+"migAnclaCto","1");}catch(e){} }
    if(!localStorage.getItem(PFX+"migAA")){
      cs=cs.map(c=>AA_IDS.includes(c.id)?{...c,capacidadRef:"Muy Alta"}:c);
      try{localStorage.setItem(PFX+"migAA","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migPix")){
      cs=cs.map(c=>(c.etapaPixan&&c.etapaPixan!=="Sin Historia")?{...c,acercamientoPixan:true}:c);
      try{localStorage.setItem(PFX+"migPix","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migTipo")){
      cs=cs.map(c=>c.tipoContacto?c:{...c,tipoContacto:"Prospecto"});
      try{localStorage.setItem(PFX+"migTipo","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migTiposContacto")){
      cs=cs.map(c=>c.tiposContacto?c:{...c,tiposContacto:c.tipoContacto?[c.tipoContacto]:[]});
      try{localStorage.setItem(PFX+"migTiposContacto","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migCaps")){
      cs=cs.map(c=>({...c,nombre:titleCase(c.nombre),apellido:titleCase(c.apellido),nombreCompleto:titleCase(c.nombreCompleto)}));
      try{localStorage.setItem(PFX+"migCaps","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migAliadoTipo")){
      cs=cs.map(c=>{ if(c.tipoAliado&&!c.tiposAliado){const{tipoAliado,...rest}=c;return {...rest,tiposAliado:[tipoAliado]};} return c; });
      try{localStorage.setItem(PFX+"migAliadoTipo","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migCandProc")){
      cs=cs.map(c=>c.etapaEspecifica==="Candidato en Proceso"?{...c,etapaEspecifica:"Candidato Identificado"}:c);
      try{localStorage.setItem(PFX+"migCandProc","1");}catch(e){}
    }
    return cs;
  });
  const[empresas,setEmpresas]=useState(()=>loadLS("empresas",null)||SEED.empresas);
  const[actividades,setActividades]=useState(()=>{
    let acts=loadLS("actividades",null)||[];
    if(!localStorage.getItem(PFX+"migEnfoque")){
      acts=acts.map(a=>a.enfoque==="Interno"?{...a,enfoque:"Tareas"}:a.enfoque==="Comercial"?{...a,enfoque:"Contactar"}:a);
      try{localStorage.setItem(PFX+"migEnfoque","1");}catch(e){}
    }
    return acts;
  });
  const[catalogos,setCatalogos]=useState(()=>{
    const base=loadLS("catalogos",null)||SEED.catalogos;
    if(!base.actividadPrincipal){
      const src=loadLS("contactos",null)||SEED.contactos;
      const acts=[...new Set((src||[]).map(c=>c.actividad).filter(Boolean))];
      base.actividadPrincipal=acts.map((a,i)=>({id:"act"+i,nombre:a}));
    }
    if(!(base.capacidadRef||[]).some(o=>o.nombre==="Muy Alta")){
      base.capacidadRef=[{id:"capMA",nombre:"Muy Alta"},...(base.capacidadRef||[])];
    }
    if(!base.etiquetas){ base.etiquetas=[]; }
    if(!localStorage.getItem(PFX+"migAnclaCat")){ const _A=["sol2","sol6","sol20","sol8","sol7","sol4","sol15","sol3"]; if(Array.isArray(base.solucion))base.solucion=base.solucion.map(s=>_A.indexOf(s.id)>=0?{...s,ancla:true}:s); try{localStorage.setItem(PFX+"migAnclaCat","1");}catch(e){} }
    if(!base.accionesInt||base.accionesInt.length===0){
      base.accionesInt=(SEED.catalogos.accionesInt)||[{id:"ai1",nombre:"Capacitación"},{id:"ai2",nombre:"Revisión de Portal"},{id:"ai3",nombre:"Elaboración de Material"},{id:"ai4",nombre:"Preparación de Propuesta"},{id:"ai5",nombre:"Investigación"},{id:"ai6",nombre:"Planificación Estratégica"},{id:"ai7",nombre:"Gestión Administrativa"}];
    }
    if(!base.tipoContacto){
      base.tipoContacto=["Prospecto","Enlace operativo","Referidor","Otro"].map((n,i)=>({id:"tc"+i,nombre:n}));
    }
    if(!base.tipoAliado){
      base.tipoAliado=["Estratégico","Comercial"].map((n,i)=>({id:"tal"+i,nombre:n}));
    }
    const ESTATUS_ALIADO_V10=["Por invitar","Invitado","En negociación","Activo","Inactivo"];
    const estatusViejoV9=["Activo","En evaluación","Inactivo"];
    if(!base.estatusAliado||(Array.isArray(base.estatusAliado)&&base.estatusAliado.length===estatusViejoV9.length&&base.estatusAliado.every((x,i)=>x&&x.nombre===estatusViejoV9[i]))){
      base.estatusAliado=ESTATUS_ALIADO_V10.map((n,i)=>({id:"eal"+i,nombre:n}));
    }
    if(!localStorage.getItem(PFX+"migAgendaCat")){
      const oldEtiq=loadLS("catEtiqAgenda",null);
      const oldTar=loadLS("catAccTareas",null);
      const oldAcc=loadLS("catAccAcciones",null);
      base.etiqAgenda=(oldEtiq&&oldEtiq.length?oldEtiq:["Comercial","Interno","Formación","Prospección","Administrativo"]).map((n,i)=>({id:"etag"+i,nombre:n}));
      base.accTareas=(oldTar||[]).map((n,i)=>({id:"actar"+i,nombre:n}));
      base.accAcciones=(oldAcc||[]).map((n,i)=>({id:"acacc"+i,nombre:n}));
      try{localStorage.setItem(PFX+"migAgendaCat","1");}catch(e){}
    }
    if(!base.etiqAgenda)base.etiqAgenda=["Comercial","Interno","Formación","Prospección","Administrativo"].map((n,i)=>({id:"etag"+i,nombre:n}));
    if(!base.accTareas)base.accTareas=[];
    if(!base.accAcciones)base.accAcciones=[];
    return base;
  });
  const[oportunidades,setOportunidades]=useState(()=>{
    let ops=loadLS("oportunidades",null)||[];
    if(!localStorage.getItem(PFX+"migSolId")){
      const sols=(catalogos.solucion||[]);
      ops=ops.map(o=>{
        if(o.solucionId) return o;
        if(o.solucionNexus){const s=sols.find(x=>x.nombre===o.solucionNexus);if(s)return{...o,solucionId:s.id};}
        return o;
      });
      try{localStorage.setItem(PFX+"migSolId","1");}catch(e){}
    }
    if(!localStorage.getItem(PFX+"migOpOper")){
      ops=ops.map(o=>o.contactosOperativosIds?o:{...o,contactosOperativosIds:o.contactoOperativoId?[o.contactoOperativoId]:[]});
      try{localStorage.setItem(PFX+"migOpOper","1");}catch(e){}
    }
    return ops;
  });
  const[productos,setProductos]=useState(()=>loadLS("productos",null)||[]);
  const[bienes,setBienes]=useState(()=>loadLS("bienes",null)||[]);
  const[openContacto,setOpenContacto]=useState(null);
  const[actModal,setActModal]=useState(null);
  const[opoModal,setOpoModal]=useState(null);

  useEffect(()=>saveLS("contactos",contactos),[contactos]);
  useEffect(()=>saveLS("empresas",empresas),[empresas]);
  useEffect(()=>saveLS("actividades",actividades),[actividades]);
  useEffect(()=>saveLS("oportunidades",oportunidades),[oportunidades]);
  useEffect(()=>saveLS("productos",productos),[productos]);
  useEffect(()=>saveLS("bienes",bienes),[bienes]);
  useEffect(()=>saveLS("catalogos",catalogos),[catalogos]);
  useEffect(()=>{
    const snap=()=>{try{const data={contactos,empresas,actividades,oportunidades,catalogos,productos,bienes,metaProspContactos:loadLS("metaProspContactos",0)};saveLS("autobackup",{fecha:new Date().toISOString(),data});}catch(e){}};
    const onHide=()=>{if(document.visibilityState==="hidden")snap();};
    document.addEventListener("visibilitychange",onHide);
    window.addEventListener("pagehide",snap);
    return ()=>{document.removeEventListener("visibilitychange",onHide);window.removeEventListener("pagehide",snap);};
  },[contactos,empresas,actividades,oportunidades,catalogos,productos,bienes]);
  useEffect(()=>{const l=document.getElementById("loading");if(l){l.classList.add("fade-out");setTimeout(()=>l.remove(),350);}},[]);

  const openAct=(init,fixed)=>setActModal({init,fixed:fixed||null});
  const[detAct,setDetAct]=useState(null);
  const verAct=(a)=>setDetAct(a.id);
  const saveAct=(data)=>{
    setActividades(prev=>{
      if(data.id)return prev.map(a=>a.id===data.id?data:a);
      const nid="a"+(Math.max(0,...prev.map(a=>parseInt((a.id||"a0").slice(1))||0))+1);
      return [...prev,{...data,id:nid}];
    });
    if(data.contactoId&&data.fecha){
      setContactos(prev=>prev.map(c=>(c.id===data.contactoId&&(!c.fechaUltimoContacto||data.fecha>c.fechaUltimoContacto))?{...c,fechaUltimoContacto:data.fecha}:c));
    }
  };

  const delAct=(id)=>setActividades(prev=>prev.filter(a=>a.id!==id));
  const onEditActs=(ids,patch)=>setActividades(prev=>prev.map(a=>ids.indexOf(a.id)>-1?aplicaPatchAct(a,typeof patch==="function"?patch(a):patch):a));
  const onCopyActs=(ids)=>setActividades(prev=>{let mx=Math.max(0,...prev.map(a=>parseInt((a.id||"a0").slice(1))||0));const cps=prev.filter(a=>ids.indexOf(a.id)>-1).map(a=>{mx+=1;const{id,...r}=a;return {...r,id:"a"+mx};});return [...prev,...cps];});
  const sinRespuesta=(a)=>{setActividades(prev=>prev.map(x=>x.id===a.id?{...x,estatus:"Cerrada",resultado:x.resultado||"Sin respuesta"}:x));if(window.confirm("Cerrada sin respuesta. ¿Agendar la siguiente acción para este contacto?")){openAct({contactoId:a.contactoId,oportunidadId:a.oportunidadId||null,tipoAccion:a.tipoAccion||"",servicioSolucion:a.servicioSolucion||null,prioridad:a.prioridad||"Media",estatus:"Programada",fecha:""},a.contactoId);}};
  const openOpo=(init,fixed)=>setOpoModal({init,fixed:fixed||null});
  const saveOpo=(data)=>{setOportunidades(prev=>{
    if(data.id)return prev.map(o=>o.id===data.id?data:o);
    const nid="o"+(Math.max(0,...prev.map(o=>parseInt((o.id||"o0").slice(1))||0))+1);
    return [...prev,{...data,id:nid}];
  });};
  const delOpo=(id)=>{setOportunidades(prev=>prev.filter(o=>o.id!==id));setActividades(prev=>prev.map(a=>a.oportunidadId===id?{...a,oportunidadId:null}:a));};

  const go=(k)=>{setOpenContacto(null);setView(k);};
  const restoreTotal=(d)=>{
    if(Array.isArray(d.contactos))setContactos(d.contactos);
    if(Array.isArray(d.empresas))setEmpresas(d.empresas);
    if(Array.isArray(d.actividades))setActividades(d.actividades);
    if(Array.isArray(d.oportunidades))setOportunidades(d.oportunidades);
    if(d.catalogos&&typeof d.catalogos==="object")setCatalogos(d.catalogos);
    if(Array.isArray(d.productos))setProductos(d.productos);
    if(Array.isArray(d.bienes))setBienes(d.bienes);
    if(typeof d.metaProspContactos!=="undefined"){try{saveLS("metaProspContactos",d.metaProspContactos);}catch(e){}}
    setView("configuracion");
  };
  const NAV=[["inicio","Inicio","🏠"],["contactos","Contactos","👥"],["empresas","Empresas","🏢"],["oportunidades","Oport.","🎯"],["agenda","Agenda","🗓"],["objetivos","Metas","📊"],["configuracion","Config.","⚙"]];
  return <div style={S.app}>
    {view==="inicio"&&<Inicio contactos={contactos} empresas={empresas} actividades={actividades} oportunidades={oportunidades} openAct={openAct} verAct={verAct} openOpo={openOpo} setView={go} catalogos={catalogos} productos={productos}/>}
    {view==="contactos"&&<Contactos key={openContacto||"list"} initialSel={openContacto} contactos={contactos} catalogos={catalogos} setCatalogos={setCatalogos} empresas={empresas} setEmpresas={setEmpresas} setContactos={setContactos} actividades={actividades} openAct={openAct} verAct={verAct} oportunidades={oportunidades} openOpo={openOpo}/>}
    {view==="empresas"&&<Empresas empresas={empresas} setEmpresas={setEmpresas} contactos={contactos} catalogos={catalogos} goContacto={(id)=>{setOpenContacto(id);setView("contactos");}}/>}
    {view==="aliados"&&<Contactos key="aliados-list" aliadosOnly onBack={()=>go("configuracion")} contactos={contactos} catalogos={catalogos} setCatalogos={setCatalogos} empresas={empresas} setEmpresas={setEmpresas} setContactos={setContactos} actividades={actividades} openAct={openAct} verAct={verAct} oportunidades={oportunidades} openOpo={openOpo}/>}
    {view==="oportunidades"&&<Oportunidades oportunidades={oportunidades} contactos={contactos} empresas={empresas} aliados={contactos.filter(c=>c.tiposAliado&&c.tiposAliado.length>0)} catalogos={catalogos} actividades={actividades} productos={productos} openOpo={openOpo} openAct={openAct} onToggleFav={(id)=>setOportunidades(p=>p.map(o=>o.id===id?{...o,fav:!o.fav}:o))}/>}
    {view==="agenda"&&<Agenda actividades={actividades} contactos={contactos} catalogos={catalogos} oportunidades={oportunidades} empresas={empresas} openAct={openAct} verAct={verAct} onEditActs={onEditActs} onCopyActs={onCopyActs} onSinRespuesta={sinRespuesta}/>}
    {view==="catalogos"&&<Catalogos catalogos={catalogos} setCatalogos={setCatalogos} contactos={contactos} setContactos={setContactos} onProductos={()=>go("productos")} onBack={()=>go("configuracion")}/>}
    {view==="productos"&&<Productos productos={productos} setProductos={setProductos} catalogos={catalogos} onBack={()=>go("configuracion")}/>}
    {view==="bienes"&&<BienesInmuebles bienes={bienes} setBienes={setBienes} catalogos={catalogos} contactos={contactos} onBack={()=>go("configuracion")}/>}
    {view==="objetivos"&&<Objetivos productos={productos} setProductos={setProductos} catalogos={catalogos} setCatalogos={setCatalogos} contactos={contactos} oportunidades={oportunidades} onProductos={()=>go("productos")}/>}
    {view==="configuracion"&&<Configuracion data={{contactos,empresas,actividades,oportunidades,catalogos,productos,bienes,metaProspContactos:loadLS("metaProspContactos",0)}} onRestore={restoreTotal} onExcel={()=>exportBackup(contactos,empresas,oportunidades,catalogos,productos)} go={go}/>}
    <div style={S.nav}>
      {NAV.map(([k,lab,ico])=>{const act=view===k||(k==="configuracion"&&(view==="catalogos"||view==="productos"||view==="aliados"||view==="bienes"));return <button key={k} style={S.navB(act)} onClick={()=>go(k)}>
        <span style={S.navIco}>{ico}</span><span>{lab}</span></button>;})}
    </div>
    {detAct&&(()=>{const da=actividades.find(x=>x.id===detAct);if(!da)return null;return <ActividadDetalle a={da} contactos={contactos} empresas={empresas} oportunidades={oportunidades} catalogos={catalogos} onClose={()=>setDetAct(null)} onEdit={()=>{setDetAct(null);openAct(da,da.contactoId);}}/>;})()}
    {actModal&&<ActividadModal init={actModal.init} fixedContacto={actModal.fixed} contactos={contactos} empresas={empresas} catalogos={catalogos} oportunidades={oportunidades} actividades={actividades} onUpdateContacto={(id,patch)=>setContactos(prev=>prev.map(c=>c.id===id?{...c,...patch}:c))} onUpdateOportunidad={(id,patch)=>setOportunidades(prev=>prev.map(o=>o.id===id?{...o,...patch}:o))} onSave={saveAct} onSaveExtra={saveAct} onDelete={delAct} onCreateContacto={(d)=>{const id="c"+Date.now();setContactos(prev=>[...prev,{...d,id}]);return id;}} onCreateEmpresa={(d)=>{const id="e"+Date.now();setEmpresas(prev=>[...prev,{...d,id}]);return id;}} onClose={()=>setActModal(null)}/>}
    {opoModal&&<OportunidadModal init={opoModal.init} fixedContacto={opoModal.fixed} contactos={contactos} empresas={empresas} catalogos={catalogos} productos={productos} onSave={saveOpo} onDelete={delOpo} onCreateContacto={(d)=>{const id="c"+Date.now();setContactos(prev=>[...prev,{...d,id}]);return id;}} onCreateEmpresa={(d)=>{const id="e"+Date.now();setEmpresas(prev=>[...prev,{...d,id}]);return id;}} onClose={()=>setOpoModal(null)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>

  const[showAvance,setShowAvance]=useState(false);
  const[moveToProjectId,setMoveToProjectId]=useState("");
  const[f,setF]=useState(()=>({estatus:"Programada",fecha:hoyISO(),prioridad:"Media",enfoque:"Contactar",modoTarea:"unica",...init,...(init&&init.modoTarea&&init.modoTarea!=="unica"?{estatus:proyEstatus(init)}:{}),...(init&&init.items?{items:[...init.items].sort(cmpItems)}:{}),...(init&&init.subtareas?{subtareas:[...init.subtareas].sort(cmpSubs)}:{})}));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const esContactar=f.enfoque==="Contactar";
  const esInterno=!esContactar;
  const cid=!esInterno?(f.contactoId||fixedContacto):null;
  const cont=cid?contactos.find(c=>c.id===cid):null;
  const opsCont=!esInterno?(oportunidades||[]).filter(o=>
    o.contactoPrincipalId===cid||o.contactoId===cid||
    (o.contactosOperativosIds||[o.contactoOperativoId].filter(Boolean)).includes(cid)||
    o.aliadoEstrategicoId===cid||o.aliadoComercialId===cid
  ):[];
  // Siempre mostrar todas las activas; las del contacto van primero destacadas
  const opsActivas=(oportunidades||[]).filter(ABIERTA);
  const opsOtras=opsActivas.filter(o=>!opsCont.find(x=>x.id===o.id));
  const opsDisp=[...opsCont.filter(ABIERTA),...opsOtras];
  const save=()=>{
    const modo=f.modoTarea||"unica";
    // ── Mover a proyecto ──
    if(esInterno&&modo==="unica"&&moveToProjectId&&onSaveExtra&&actividades){
      const proj=actividades.find(a=>a.id===moveToProjectId);
      if(proj){
        if(!f.asunto){alert("Indica el asunto antes de mover");return;}
        const ns={id:"st"+Date.now(),titulo:f.asunto,fecha:f.fecha||"",estatus:f.estatus||"Programada",prioridad:f.prioridad||"Media",descripcion:f.intencion||""};
        const allSubs=[...(proj.subtareas||[]),ns];
        const sts=allSubs.map(s=>s.estatus||"Programada");
        const compEst=sts.every(s=>s==="Cerrada")?"Cerrada":sts.some(s=>s==="En Proceso"||s==="Cerrada")?"En Proceso":"Programada";
        const pend=allSubs.filter(s=>s.estatus!=="Cerrada");
        const ds=pend.map(s=>s.fecha).filter(Boolean).sort();
        const compFecha=ds[0]||allSubs.map(s=>s.fecha).filter(Boolean).sort()[0]||"";
        onSaveExtra({...proj,subtareas:allSubs,estatus:compEst,fecha:compFecha,cierreForzado:false});
        if(f.id)onDelete(f.id);
        onClose();return;
      }
    }
    if(!esInterno){
      const cid=f.contactoId||fixedContacto;
      if(!cid){alert("Selecciona un contacto");return;}
      
      if(!f.tipoAccion){alert("Indica el tipo de acción");return;}
      onSave({...f,contactoId:cid,asunto:null});
    } else {
      if(modo==="proyecto"){
        if(!(f.subtareas||[]).length){alert("Agrega al menos una subtarea al proyecto");return;}
        const pend=(f.subtareas||[]).filter(s=>s.estatus!=="Cerrada");
        const ds=pend.map(s=>s.fecha).filter(Boolean).sort();
        const compFecha=ds[0]||(f.subtareas||[]).map(s=>s.fecha).filter(Boolean).sort()[0]||"";
        const sts=(f.subtareas||[]).map(s=>s.estatus||"Programada");
        const estIni=(init&&init.id)?proyEstatus(init):null;
        const usuarioCerro=f.estatus==="Cerrada"&&(estIni!=="Cerrada"||!!f.cierreForzado);
        const nTot=sts.length;const nDone=sts.filter(x=>x==="Cerrada").length;
        const forzado=usuarioCerro&&nDone<nTot;
        const compEst=usuarioCerro?"Cerrada":(sts.every(s=>s==="Cerrada")?"Cerrada":sts.some(s=>s==="En Proceso"||s==="Cerrada")?"En Proceso":"Programada");
        if(forzado&&!f.cierreForzado&&!window.confirm(`Hay ${nTot-nDone} subtarea${nTot-nDone!==1?"s":""} sin concluir. ¿Cerrar de todas formas?`))return;
        onSave({...f,contactoId:f.contactoId||null,oportunidadId:f.oportunidadId||null,servicioSolucion:null,fecha:compFecha,estatus:compEst,cierreForzado:forzado,subtareas:[...(f.subtareas||[])].sort(cmpSubs)});
      } else {
        if(modo==="checklist"){
          const done=(f.items||[]).filter(i=>i.done).length;const total=(f.items||[]).length;
          // Si el usuario forzó "Cerrada" explícitamente, respetarlo con advertencia
          const estIni=(init&&init.id)?proyEstatus(init):null;
          const usuarioCerro=f.estatus==="Cerrada"&&(estIni!=="Cerrada"||!!f.cierreForzado);
          const forzado=usuarioCerro&&total>0&&done<total;
          const compEst=usuarioCerro?"Cerrada":(total>0&&done===total?"Cerrada":done>0?"En Proceso":"Programada");
          if(forzado&&!f.cierreForzado&&!window.confirm(`Hay ${total-done} subactividad${total-done!==1?"es":""} sin concluir. ¿Cerrar de todas formas?`))return;
          onSave({...f,servicioSolucion:null,estatus:compEst,cierreForzado:forzado,items:[...(f.items||[])].sort(cmpItems)});
        } else {
          
          if(!f.tipoAccion){alert("Indica el tipo de acción");return;}
          onSave({...f,servicioSolucion:null});
        }
      }
    }
    if(!esInterno&&f.estatus==="Cerrada"&&window.confirm("Actividad cerrada. ¿Agendar la siguiente acción para este contacto?")){
      const cid=f.contactoId||fixedContacto;
      setF({contactoId:cid,oportunidadId:f.oportunidadId||null,estatus:"Programada",fecha:"",hora:null,prioridad:f.prioridad||"Media",tipoAccion:"",servicioSolucion:null,intencion:"",resultado:"",enfoque:"Contactar",modoTarea:"unica"});
      return;
    }
    onClose();
  };
  const cerrarSinRespuesta=()=>{
    if(!cid){alert("Selecciona un contacto");return;}
    
    if(!f.tipoAccion){alert("Indica el tipo de acción");return;}
    onSave({...f,contactoId:cid,estatus:"Cerrada",resultado:f.resultado||"Sin respuesta"});
    if(window.confirm("Cerrada sin respuesta. ¿Agendar la siguiente acción para este contacto?")){
      setF({contactoId:cid,oportunidadId:f.oportunidadId||null,estatus:"Programada",fecha:"",hora:null,prioridad:f.prioridad||"Media",tipoAccion:f.tipoAccion||"",servicioSolucion:f.servicioSolucion||null,intencion:"",resultado:"",enfoque:"Contactar"});
      setEsCopia(false);return;
    }
    onClose();
  };
  return <div style={S.modal} onClick={onClose}><div style={S.mBox} onClick={e=>e.stopPropagation()}>
    <div style={S.mTit}>{esCopia?"Copia de actividad":(init&&init.id?"Editar actividad":"Nueva actividad")}</div>
    {esCopia&&<div style={{fontSize:10,color:GOLD,marginBottom:10,marginTop:-6}}>Se guardará como una actividad nueva.</div>}

    {/* ── ENFOQUE ── */}
    <Field label="Enfoque">
      <div style={{display:"flex",gap:6}}>
        {[["Contactar","📞","#60a5fa"],["Tareas","📋","#a78bfa"],["Acciones","⚡","#2dd4bf"]].map(([v,ic,c])=>(
          <button key={v} style={{flex:1,padding:"8px 0",fontSize:12,fontWeight:700,border:`1px solid ${f.enfoque===v?c:c+"33"}`,borderRadius:8,cursor:"pointer",background:f.enfoque===v?c+"22":"transparent",color:f.enfoque===v?c:"#475569"}}
            onClick={()=>{set("enfoque",v);set("tipoAccion","");if(v==="Contactar")set("asunto","");else set("contactoId",null);}}>{ic} {v}</button>
        ))}
      </div>
    </Field>

    {/* ── CAMPOS COMERCIALES ── */}
    {!esInterno&&(<>
      {fixedContacto
        ? <div style={{fontSize:11,color:"#64748b",marginBottom:12,padding:"9px 11px",background:"#13131f",borderRadius:8}}>Contacto: <b style={{color:"#e2e8f0"}}>{cont?nombreDisplay(cont):"—"}</b>{cont&&cont.etapaPrincipal?` · ${cont.etapaPrincipal}`:""}</div>
        : <Field label="Contacto">
            <BuscaCtoEmpCFC contactos={contactos||[]} empresas={empresas||[]} value={f.contactoId} onChange={v=>{set("contactoId",v||null);}} placeholder="🔍 Buscar nombre o empresa…" onAdd={(nombre)=>{setNuevoCto({nombre:nombre||null});}}/>
            {nuevoCto&&<div onClick={e=>e.stopPropagation()}><ContactoModal init={nuevoCto} catalogos={catalogos} empresas={empresas} onCreateEmpresa={onCreateEmpresa} onSave={(d)=>{const id=onCreateContacto(d);set("contactoId",id);setNuevoCto(null);}} onClose={()=>setNuevoCto(null)}/></div>}
          </Field>}
    </>)}

    {/* ── CAMPOS INTERNOS ── */}
    {esInterno&&(<>
      <Field label="Tipo de tarea">
        <div style={{display:"flex",gap:5}}>
          {[["unica","1️⃣ Única"],["checklist","☑ Checklist"],["proyecto","📁 Proyecto"]].map(([v,l])=>(
            <button key={v} style={{flex:1,padding:"7px 4px",fontSize:11,fontWeight:700,border:`1px solid ${(f.modoTarea||"unica")===v?"#a78bfa":"#a78bfa33"}`,borderRadius:8,cursor:"pointer",background:(f.modoTarea||"unica")===v?"#a78bfa22":"transparent",color:(f.modoTarea||"unica")===v?"#a78bfa":"#475569"}}
              onClick={()=>set("modoTarea",v)}>{l}</button>
          ))}
        </div>
      </Field>
      <Field label={LblVoz("Asunto / Tarea",v=>set("asunto",(f.asunto||"")+" "+v))}>
        <textarea style={{...S.ta}} value={f.asunto||""} onChange={e=>set("asunto",e.target.value)} placeholder="Ej. Revisar portal AMIS, Preparar propuesta Copachisa…"/>
      </Field>
      {(f.modoTarea||"unica")==="checklist"&&<ChecklistEditor items={f.items||[]} onChange={v=>setF(p=>{const reabre=p.cierreForzado&&(p.items||[]).some(o=>o.done&&(v.find(n=>n.id===o.id)||{done:true}).done===false);return {...p,items:v,...(reabre?{cierreForzado:false,estatus:"En Proceso"}:{})};})}/>}
      {(f.modoTarea||"unica")==="proyecto"&&<SubtareasEditor subtareas={f.subtareas||[]} onChange={v=>setF(p=>{const reabre=p.cierreForzado&&(p.subtareas||[]).some(o=>o.estatus==="Cerrada"&&(v.find(n=>n.id===o.id)||{estatus:"Cerrada"}).estatus!=="Cerrada");return {...p,subtareas:v,...(reabre?{cierreForzado:false,estatus:"En Proceso"}:{})};})}
        onIndependizar={onSaveExtra?(idx)=>{
          const st=(f.subtareas||[])[idx];
          if(!st)return;
          if(!window.confirm(`¿Independizar "${st.titulo||"esta subtarea"}" como actividad única?`))return;
          onSaveExtra({enfoque:f.enfoque,modoTarea:"unica",asunto:st.titulo,fecha:st.fecha||"",estatus:st.estatus||"Programada",prioridad:st.prioridad||"Media",intencion:st.descripcion||""});
          set("subtareas",(f.subtareas||[]).filter((_,j)=>j!==idx));
        }:undefined}
      />}
    </>)}

    <div style={S.g2}>
      {(f.modoTarea||"unica")!=="proyecto"&&<Field label="Fecha"><input type="date" style={S.inp} value={f.fecha||""} onChange={e=>set("fecha",e.target.value)}/></Field>}
      {(f.modoTarea||"unica")==="proyecto"&&<Field label="Fecha"><div style={{fontSize:10,color:"#64748b",padding:"9px 10px",background:"#0f172a",borderRadius:8,border:"1px solid #1e293b"}}>Calculada de subtareas</div></Field>}
      {(f.modoTarea||"unica")!=="proyecto"&&<Field label="Hora"><input type="time" style={S.inp} value={f.hora||""} onChange={e=>set("hora",e.target.value||null)}/></Field>}
    </div>
    <div style={S.g2}>
      <Field label="Estatus">
        <select style={S.sel} value={f.estatus||"Programada"} onChange={e=>set("estatus",e.target.value)}>
          {(catalogos.estatusAccion||[]).map(o=><option key={o.id} value={o.nombre}>{o.nombre}</option>)}
        </select>
      </Field>
      <Field label="Prioridad">
        <select style={S.sel} value={f.prioridad||"Media"} onChange={e=>set("prioridad",e.target.value)}>
          {PRIOR.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </Field>
    </div>

    <Field label={esInterno?`Tipo de ${f.enfoque||"tarea"}`:"Tipo de acción"}>
      <CatSelect cat={esInterno?(f.enfoque==="Acciones"?(catalogos.accAcciones||[]):(catalogos.accTareas||[])):(catalogos.tipoAccion||[])} value={f.tipoAccion} onChange={v=>set("tipoAccion",v)}/>
    </Field>
    {(catalogos.etiqAgenda||[]).length>0&&<Field label="Orientación">
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {(catalogos.etiqAgenda||[]).map(et=>{const on=(f.etiquetasAgenda||[]).includes(et.nombre);return <span key={et.id} style={{...S.tag(on?"#f472b6":"#334155"),cursor:"pointer",fontSize:10}} onClick={()=>set("etiquetasAgenda",on?(f.etiquetasAgenda||[]).filter(x=>x!==et.nombre):[...(f.etiquetasAgenda||[]),et.nombre])}>🏷 {et.nombre}</span>;})}
      </div>
    </Field>}

      {!esInterno&&(<>
        <Field label="Servicio / solución en seguimiento"><CatSelect cat={catalogos.solucion} value={f.servicioSolucion} onChange={v=>set("servicioSolucion",v)} placeholder="— Opcional —"/></Field>
        <Field label="Oportunidad ligada (opcional)">
          {/* Aviso si hay oportunidades directas del contacto sin vincular */}
          {cid&&!f.oportunidadId&&opsCont.filter(ABIERTA).length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:7,background:"#fbbf2411",border:"1px solid #fbbf2444",borderRadius:8,padding:"7px 10px",marginBottom:7,cursor:"pointer"}} onClick={()=>{if(opsCont.filter(ABIERTA).length===1)set("oportunidadId",opsCont.filter(ABIERTA)[0].id);}}>
              <span style={{fontSize:14}}>💡</span>
              <div style={{flex:1}}>
                <div style={{fontSize:10,fontWeight:700,color:"#fbbf24"}}>
                  {opsCont.filter(ABIERTA).length===1
                    ? `Este contacto tiene "${opsCont.filter(ABIERTA)[0].concepto}" abierta`
                    : `Este contacto tiene ${opsCont.filter(ABIERTA).length} oportunidades abiertas`}
                </div>
                <div style={{fontSize:9,color:"#92400e"}}>{opsCont.filter(ABIERTA).length===1?"Toca para vincular automáticamente":"Selecciona abajo para vincular"}</div>
              </div>
            </div>
          )}
          {opsCont.length===0&&<div style={{fontSize:9,color:"#64748b",marginBottom:5}}>Este contacto no aparece en ninguna oportunidad directamente — puedes vincular a cualquiera.</div>}
          <select style={{...S.sel,borderColor:!f.oportunidadId&&opsCont.filter(ABIERTA).length>0?"#fbbf2466":undefined}} value={f.oportunidadId||""} onChange={e=>set("oportunidadId",e.target.value||null)}>
            <option value="">— Sin vincular a oportunidad —</option>
            {opsCont.filter(ABIERTA).length>0&&<optgroup label="── Del contacto ──">
              {opsCont.filter(ABIERTA).map(o=><option key={o.id} value={o.id}>🎯 {o.concepto}</option>)}
            </optgroup>}
            {opsOtras.length>0&&<optgroup label="── Otras activas ──">
              {opsOtras.map(o=><option key={o.id} value={o.id}>{o.concepto}</option>)}
            </optgroup>}
          </select>
        </Field>
      </>)}

    <Field label={LblVoz(esInterno?"Descripción / objetivo":"Intención (al programar)",v=>set("intencion",(f.intencion||f.intencionResultado||"")+" "+v))}><textarea style={S.ta} value={f.intencion||f.intencionResultado||""} onChange={e=>set("intencion",e.target.value||null)} placeholder={esInterno?"Qué se va a hacer o revisar…":"Qué se busca lograr…"}/></Field>
    {(f.estatus==="En Proceso"||f.estatus==="Cerrada"||f.accionProceso)&&<Field label={LblVoz("Acción ejecutada (en proceso)",v=>set("accionProceso",(f.accionProceso||"")+" "+v))}><textarea style={S.ta} value={f.accionProceso||""} onChange={e=>set("accionProceso",e.target.value||null)} placeholder="Qué se hizo…"/></Field>}
    {(f.estatus==="Cerrada"||f.resultado)&&<Field label={LblVoz("Resultado (al concluir)",v=>set("resultado",(f.resultado||"")+" "+v))}><textarea style={S.ta} value={f.resultado||""} onChange={e=>set("resultado",e.target.value||null)} placeholder="Qué resultó…"/></Field>}

    {!esInterno&&cont&&<button style={{...S.cancB,color:"#a78bfa",borderColor:"#a78bfa55"}} onClick={()=>setShowAvance(v=>!v)}>{showAvance?"▾ Ocultar avance del contacto":"▸ Avance del contacto"}</button>}
    {!esInterno&&showAvance&&cont&&<div style={{...S.card("#a78bfa44"),marginBottom:12}}>
      <div style={{fontSize:10,color:"#a78bfa",fontWeight:700,letterSpacing:0.5,marginBottom:8}}>AVANCE DEL CONTACTO</div>
      <Field label="Etapa de avance (específica)">
        <select style={S.sel} value={cont.etapaEspecifica||""} onChange={e=>{const nv=e.target.value;const esp=(catalogos.etapaEspecifica||[]).find(x=>x.nombre===nv);onUpdateContacto&&onUpdateContacto(cont.id,{etapaEspecifica:nv||null,etapaPrincipal:esp?esp.principal:cont.etapaPrincipal});}}>
          <option value="">— Sin etapa —</option>
          {(catalogos.etapaEspecifica||[]).map(o=><option key={o.id} value={o.nombre}>{o.nombre}{o.principal?` · ${o.principal}`:""}</option>)}
        </select>
      </Field>
      {opsCont.length>0&&<div style={{marginTop:2}}>
        <div style={{fontSize:10,color:"#64748b",marginBottom:6}}>Oportunidades del contacto ({opsCont.length})</div>
        {opsCont.map(o=><div key={o.id} style={{marginBottom:8,padding:"8px 10px",background:"#10101e",border:"1px solid #1e293b",borderRadius:8}}>
          <div style={{fontSize:12,fontWeight:700,color:"#e2e8f0",marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.concepto||"Oportunidad"}</div>
          <select style={{...S.sel,fontSize:12,padding:"6px 8px"}} value={o.etapa||""} onChange={e=>onUpdateOportunidad&&onUpdateOportunidad(o.id,{etapa:e.target.value||null})}>
            <option value="">— Sin etapa —</option>
            {(catalogos.etapaOportunidad||[]).map(eo=><option key={eo.id} value={eo.nombre}>{eo.nombre}</option>)}
          </select>
        </div>)}
      </div>}
    </div>}
    {/* ── VÍNCULO A CONTACTO/OPORTUNIDAD (solo Tareas/Acciones) ── */}
    {esInterno&&(()=>{
      const ctoVinc=f.contactoId?contactos.find(c=>c.id===f.contactoId):null;
      const opsDelCto=ctoVinc?(oportunidades||[]).filter(o=>o.contactoPrincipalId===ctoVinc.id||o.contactoId===ctoVinc.id||(o.contactosOperativosIds||[o.contactoOperativoId].filter(Boolean)).includes(ctoVinc.id)):[];
      return <div style={{...S.card("#7dd3fc"),border:"1px solid #7dd3fc33",marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#7dd3fc",marginBottom:8}}>🔗 Vincular a contacto / oportunidad</div>
        {ctoVinc
          ? <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:f.oportunidadId||opsDelCto.length>0?8:0}}>
              <div style={{...S.inp,flex:1,fontSize:12}}>{nombreDisplay(ctoVinc)}</div>
              <button style={{background:"none",border:"1px solid #334155",borderRadius:8,color:"#64748b",padding:"8px 10px",cursor:"pointer",fontSize:12}} onClick={()=>{set("contactoId",null);set("oportunidadId",null);}}>✕</button>
            </div>
          : <BuscaCtoEmpCFC contactos={contactos||[]} empresas={empresas||[]} value={null} onChange={v=>set("contactoId",v||null)} placeholder="🔍 Buscar contacto a vincular…"/>
        }
        {ctoVinc&&opsDelCto.length>0&&<Field label="Oportunidad (opcional)">
          <select style={S.sel} value={f.oportunidadId||""} onChange={e=>set("oportunidadId",e.target.value||null)}>
            <option value="">— Solo el contacto —</option>
            {opsDelCto.map(o=><option key={o.id} value={o.id}>{ABIERTA(o)?"🎯 ":"✓ "}{o.concepto}</option>)}
          </select>
        </Field>}
      </div>;
    })()}
    {/* ── MOVER A PROYECTO (solo actividades únicas internas) ── */}
    {esInterno&&(f.modoTarea||"unica")==="unica"&&onSaveExtra&&(()=>{
      const proyectos=(actividades||[]).filter(a=>(a.enfoque==="Tareas"||a.enfoque==="Acciones")&&a.modoTarea==="proyecto"&&a.id!==f.id);
      if(!proyectos.length)return null;
      return <div style={{...S.card(),marginBottom:10,border:"1px solid #60a5fa33"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#60a5fa",marginBottom:8}}>↙ Mover a proyecto</div>
        <select style={S.sel} value={moveToProjectId} onChange={e=>setMoveToProjectId(e.target.value)}>
          <option value="">— Mantener como actividad única —</option>
          {proyectos.map(p=><option key={p.id} value={p.id}>📁 {p.asunto||"Proyecto sin nombre"}</option>)}
        </select>
        {moveToProjectId&&<div style={{fontSize:9,color:"#60a5fa",marginTop:5}}>Al guardar se convertirá en subtarea del proyecto seleccionado.</div>}
      </div>;
    })()}
    <button style={S.saveB} onClick={save}>Guardar</button>
    {!esInterno&&init&&init.id&&!esCopia&&(f.estatus==="Programada"||f.estatus==="En Proceso")&&<button style={{...S.cancB,color:"#fb923c",borderColor:"#fb923c55"}} onClick={cerrarSinRespuesta}>Cerrar sin respuesta</button>}
    {init&&init.id&&!esCopia&&<button style={S.cancB} onClick={()=>{setF(p=>{const{id,...r}=p;return r;});setEsCopia(true);}}>Copiar como nueva</button>}
    {init&&init.id&&!esCopia&&<button style={{...S.cancB,color:"#f87171",borderColor:"#f8717144"}} onClick={()=>{if(window.confirm("¿Eliminar esta actividad?")){onDelete(init.id);onClose();}}}>Eliminar actividad</button>}
    <button style={S.cancB} onClick={onClose}>Cancelar</button>
  </div></div>;
}

/* Orden por defecto de listas: Estatus (En Proceso, Programada, Cerrada) → Fecha (asc; en Cerradas desc) → Prioridad → Hora */
const EST_RANK={"En Proceso":0,Programada:1,Cerrada:2};
const nEFP=(a)=>({e:proyEstatus(a),f:proyFecha(a)||a.fecha||"",p:proyPrioridad(a),h:a.hora||""});
const nEFPSub=(x)=>({e:x.estatus||"Programada",f:x.fecha||"",p:x.prioridad||"Media",h:""});
const cmpEFP=(x,y,dir)=>{
  const ra=EST_RANK[x.e]!=null?EST_RANK[x.e]:1,rb=EST_RANK[y.e]!=null?EST_RANK[y.e]:1;if(ra!==rb)return ra-rb;
  if(x.f!==y.f){if(!x.f)return 1;if(!y.f)return -1;const asc=(dir!=="desc")!==(ra===2);const c=x.f.localeCompare(y.f);return asc?c:-c;}
  const pa=PRIOR_RANK[x.p]!=null?PRIOR_RANK[x.p]:2,pb=PRIOR_RANK[y.p]!=null?PRIOR_RANK[y.p]:2;if(pa!==pb)return pa-pb;
  return (x.h||"99:99").localeCompare(y.h||"99:99");
};
const cmpSubs=(x,y)=>cmpEFP(nEFPSub(x),nEFPSub(y),"asc");
const cmpItems=(x,y)=>x.done!==y.done?(x.done?1:-1):((PRIOR_RANK[x.prioridad||"Media"]!=null?PRIOR_RANK[x.prioridad||"Media"]:2)-(PRIOR_RANK[y.prioridad||"Media"]!=null?PRIOR_RANK[y.prioridad||"Media"]:2));

    return true;

        {["Programada","En Proceso","Cerrada"].map(t=><span key={t} style={{...S.chip(filtros.includes(t),EST_COLOR[t]||GOLD),fontSize:10,padding:"3px 8px"}} onClick={()=>toggleFiltro(t)}>{t}</span>)}
        {filtros.length>0&&<span style={{...S.chip(false,"#64748b"),fontSize:10,padding:"3px 8px",opacity:.8}} onClick={()=>setFiltros([])}>✕</span>}
        {featTag&&<span style={{marginLeft:"auto",flexShrink:0,cursor:"pointer",fontSize:16,filter:fFeat?"none":"grayscale(1) opacity(0.4)"}} title={featTag.nombre} onClick={()=>setFFeat(v=>!v)}>💰</span>}
        <span style={{flexShrink:0,cursor:"pointer",fontSize:16,filter:fStarred?"none":"grayscale(1) opacity(0.4)"}} title="Destacadas" onClick={()=>setFStarred(v=>!v)}>⭐</span>
      </div>
      {/* Fila 3: búsqueda + filtros */}
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <input style={{...S.inp,flex:1,fontSize:12}} placeholder="🔍 Buscar…" value={q} onChange={e=>setQ(e.target.value)}/>

        {(q||nFil>0)&&<button style={{...S.pill(false,"#f87171"),padding:"0 10px",fontWeight:700,fontSize:12}} onClick={()=>{setQ("");limpiar();}}>✕</button>}
      </div>
    </div>
    {/* ── PANEL DE FILTROS ── */}
    <div style={{...S.sec,paddingTop:4}}>
      {showFil&&<div style={{...S.card(),marginTop:0,padding:"10px 12px"}}>
        {/* Selección múltiple + Rezago — primero, igual que APersonal */}
        <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
          {!selMode
            ? <button style={{...S.pill(false,GOLD),padding:"5px 10px",fontWeight:700,flex:1,fontSize:11}} onClick={()=>{setSelMode(true);setSel([]);}}>☑ Selección múltiple</button>
            : <div style={{display:"flex",gap:4,flex:1,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>{sel.length} sel.</span>
                <button style={{...S.pill(false,"#60a5fa"),padding:"3px 7px",fontSize:10}} onClick={()=>setSel(ordenadas.map(a=>a.id))}>Todas</button>
                <button style={{...S.pill(false,"#64748b"),padding:"3px 7px",fontSize:10}} onClick={()=>setSel([])}>Ninguna</button>
                <button style={{...S.pill(false,GOLD),padding:"3px 7px",fontWeight:700,fontSize:10,opacity:sel.length?1:.4}} onClick={()=>{if(sel.length)setBatch({fecha:"",estatus:"",tipoAccion:"",prioridad:""});}}>Editar</button>
                <button style={{...S.pill(false,"#f87171"),padding:"3px 7px",fontSize:10}} onClick={()=>{setSelMode(false);setSel([]);}}>Salir</button>
              </div>}
          <button style={{...S.pill(fRezago,"#ef4444"),padding:"5px 12px",fontWeight:700,fontSize:11,flexShrink:0}} onClick={()=>setFRezago(v=>!v)}>⚠ Rezago</button>
        </div>
        {/* ORDEN */}
        <div style={{marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Orden</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            <button style={{...S.pill(ordCampo==="",GOLD),padding:"4px 9px",fontSize:11}} onClick={()=>setOrdCampo("")}>Estatus</button>
            <button style={{...S.pill(ordCampo==="fechaPrio",GOLD),padding:"4px 9px",fontSize:11}} onClick={()=>setOrdCampo(v=>v==="fechaPrio"?"":"fechaPrio")}>Fecha+Prio</button>
            <button style={{...S.pill(ordCampo==="fecha",GOLD),padding:"4px 9px",fontSize:11}} onClick={()=>setOrdCampo(v=>v==="fecha"?"":"fecha")}>Fecha</button>
            <button style={{...S.pill(ordCampo==="prioridad",GOLD),padding:"4px 9px",fontSize:11}} onClick={()=>setOrdCampo(v=>v==="prioridad"?"":"prioridad")}>Prioridad</button>
            <button style={{...S.pill(false,"#60a5fa"),padding:"4px 9px",fontSize:11}} onClick={()=>setOrdDir(d=>d==="asc"?"desc":"asc")}>{ordDir==="asc"?"↑ Asc":"↓ Desc"}</button>
          </div>
        </div>
        {/* PRIORIDAD */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Prioridad</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{PRIOR.map(p=><span key={p} style={{...S.chip(fPrioridad.includes(p),PRIOR_COLOR[p]),fontSize:10,cursor:"pointer"}} onClick={()=>setFPrioridad(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p])}>{p}</span>)}</div>
        </div>
        {/* ORIENTACIÓN */}
        {catalogos.etiqAgenda&&catalogos.etiqAgenda.length>0&&<div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Orientación</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {catalogos.etiqAgenda.map(et=><span key={et.id} style={{...S.chip(fEtiqAgenda===et.nombre,"#f472b6"),fontSize:10,cursor:"pointer"}} onClick={()=>setFEtiqAgenda(fEtiqAgenda===et.nombre?"":et.nombre)}>🏷 {et.nombre}</span>)}
          </div>
        </div>}
        {/* TIPO DE ACCIÓN */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Tipo de acción</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{(catalogos.tipoAccion||[]).map(t=><span key={t.id} style={{...S.chip(fTipos.includes(t.nombre),GOLD),fontSize:10,cursor:"pointer"}} onClick={()=>toggleTipo(t.nombre)}>{t.nombre}</span>)}</div>
        </div>
        {/* CONTACTO */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Contacto</div>
          <BuscaSelect opciones={contactos.slice().sort((a,b)=>(a.nombreCompleto||"").localeCompare(b.nombreCompleto||"")).map(c=>({id:c.id,label:nombreDisplay(c)}))} value={fContacto} onChange={v=>setFContacto(v)} placeholder="— Cualquiera —" vacioLabel="— Cualquiera —"/>
        </div>
        {/* EMPRESA */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Empresa</div>
          <BuscaSelect opciones={empresas.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).map(e=>({id:e.id,label:e.nombre}))} value={fEmpresa} onChange={v=>setFEmpresa(v)} placeholder="— Cualquiera —" vacioLabel="— Cualquiera —"/>
        </div>
        {/* ETAPAS */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={S.g2}>
            <div><div style={{fontSize:9,color:"#64748b",fontWeight:700,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Etapa contacto</div><select style={{...S.sel,fontSize:11}} value={fEtC} onChange={e=>setFEtC(e.target.value)}><option value="">— Cualquiera —</option>{(catalogos.etapaEspecifica||[]).map(et=><option key={et.id} value={et.nombre}>{et.nombre}</option>)}</select></div>
            <div><div style={{fontSize:9,color:"#64748b",fontWeight:700,marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Etapa opo.</div><select style={{...S.sel,fontSize:11}} value={fEtO} onChange={e=>setFEtO(e.target.value)}><option value="">— Cualquiera —</option>{(catalogos.etapaOportunidad||[]).map(et=><option key={et.id} value={et.nombre}>{et.nombre}</option>)}</select></div>
          </div>
        </div>
        {/* FECHAS — Todas / Hoy / Rango */}
        <div style={{borderTop:"1px solid #1e293b",paddingTop:8,marginBottom:8}}>
          <div style={{fontSize:9,color:"#64748b",marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>Fechas</div>
          <div style={{display:"flex",gap:5,marginBottom:6}}>
            <button style={{...S.pill(!desde&&!hasta,GOLD),flex:1,padding:"5px 0",fontSize:11}} onClick={()=>{setDesde("");setHasta("");}}>Todas</button>
            <button style={{...S.pill(desde===hoyISO()&&hasta===hoyISO(),"#60a5fa"),flex:1,padding:"5px 0",fontSize:11}} onClick={()=>{setDesde(hoyISO());setHasta(hoyISO());}}>Hoy</button>
            <button style={{...S.pill(!!(desde||hasta)&&!(desde===hoyISO()&&hasta===hoyISO()),"#a78bfa"),flex:1,padding:"5px 0",fontSize:11}} onClick={()=>{}}>Rango</button>
          </div>
          {(desde||hasta)&&<div style={S.g2}>
            <div><div style={{fontSize:9,color:"#64748b",marginBottom:3}}>Desde</div><input type="date" style={{...S.inp,fontSize:11}} value={desde} onChange={e=>{setDesde(e.target.value);if(e.target.value&&!hasta)setHasta(e.target.value);}}/></div>
            <div><div style={{fontSize:9,color:"#64748b",marginBottom:3}}>Hasta</div><input type="date" style={{...S.inp,fontSize:11}} value={hasta} onChange={e=>setHasta(e.target.value)}/></div>
          </div>}
        </div>
        {nFil>0&&<button style={{...S.pill(false,"#f87171"),width:"100%",padding:"6px 0",fontWeight:700,fontSize:11}} onClick={limpiar}>✕ Limpiar filtros ({nFil})</button>}
      </div>}
    </div>
    {/* ── CONTENIDO ── */}
    <div id="ag-top" style={{...S.sec,paddingTop:4}}>
      <div style={{fontSize:11,color:"#64748b",marginBottom:6}}>{base.length} de {actividades.length} actividades</div>
      {modo==="lista"&&<ActividadesList acts={ordenadas} allActs={actividades} contactos={contactos} oportunidades={oportunidades} empresas={empresas} showContacto={true} asc={ordCampo===""?ordDir==="asc":((ordCampo==="fecha"||ordCampo==="fechaPrio")&&ordDir==="asc")} hoyEst={ordCampo===""} noSort={true} hoy={hoyISO()} selectable={selMode} selected={sel} onToggleSel={toggleSel} onSinRespuesta={onSinRespuesta} onPatchAct={(id,patch)=>onEditActs([id],patch)} onTap={(a)=>verAct?verAct(a):openAct(a,a.contactoId)} onEdit={(a)=>openAct(a,a.contactoId)} featTag={featTag}/>}
      {(modo==="rptCom"||modo==="rptTar"||modo==="rptAcc")&&(()=>{
        const esCom=modo==="rptCom";
        const enfRpt=modo==="rptCom"?"Contactar":modo==="rptTar"?"Tareas":"Acciones";
        const rptActs=ordenadas.filter(a=>(a.enfoque||"Contactar")===enfRpt);
        if(rptActs.length===0)return <div style={{fontSize:11,color:"#475569",padding:"4px 0"}}>Sin actividades {esCom?"comerciales":"internas"} en el rango y filtros elegidos.</div>;
        return <div style={{...S.card(),padding:0,overflow:"hidden"}}>
          {/* Encabezado — mismo patrón que APersonal Reporte */}
          <div style={{display:"flex",gap:8,fontSize:9,fontWeight:800,color:"#64748b",letterSpacing:.5,textTransform:"uppercase",padding:"7px 10px",borderBottom:"1px solid #1e293b"}}>
            <div style={{width:20,flexShrink:0}}></div>
            <div style={{width:18,flexShrink:0}}></div>
            <div style={{width:62,flexShrink:0}}>Fecha</div>
            <div style={{flex:esCom?1.6:2.4,minWidth:0}}>{esCom?"Contacto/Empresa":"Asunto"}</div>
            {esCom&&<div style={{flex:1,minWidth:0}}>Tipo</div>}
            <div style={{width:62,flexShrink:0,textAlign:"right"}}>Estatus</div>
          </div>
          {rptActs.map((a,i)=>{
            const efEst=proyEstatus(a);const col=EST_COLOR[efEst]||"#64748b";
            const efFech=proyFecha(a)||a.fecha||"";
            const isSel=selMode&&sel.indexOf(a.id)>-1;
            const ctoObj=contactos.find(x=>x.id===a.contactoId);
            const empObj=esCom&&ctoObj?(empresas||[]).find(e=>e.id===(cEmpresas(ctoObj)[0]||{}).empresaId):null;
            const principal=esCom?((nombreDisplay(ctoObj))||empObj?.nombre||"—"):(a.asunto||a.tipoAccion||"—");
            const isFeatRow=featTag&&(a.etiquetasAgenda||[]).includes(featTag.nombre);
            return <div key={a.id} id={i===repHoyIdx?"ag-hoy":undefined} onClick={()=>selMode?toggleSel(a.id):(verAct?verAct(a):openAct(a,a.contactoId))} style={{display:"flex",gap:8,fontSize:11,padding:"7px 10px",borderBottom:"1px solid #14141f",cursor:"pointer",alignItems:"flex-start",background:isSel?"#16213a":"transparent",borderLeft:`3px solid ${ENF_CFC_COLOR[a.enfoque]||col}`}}>
              {selMode&&<span style={{width:14,height:14,flexShrink:0,borderRadius:"50%",border:isSel?"none":"1.5px solid #475569",background:isSel?GOLD:"transparent",color:"#0c0c16",fontSize:9,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{isSel?"✓":""}</span>}
              <div style={{width:20,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {featTag&&<span onClick={e=>{e.stopPropagation();onEditActs([a.id],{etiquetasAgenda:isFeatRow?(a.etiquetasAgenda||[]).filter(x=>x!==featTag.nombre):[...(a.etiquetasAgenda||[]),featTag.nombre]});}} style={{cursor:"pointer",fontSize:13,filter:isFeatRow?"none":"grayscale(1) opacity(0.3)"}}>💰</span>}
              </div>
              <span onClick={e=>{e.stopPropagation();onEditActs([a.id],{starred:!a.starred});}} title="Destacada" style={{width:18,flexShrink:0,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",filter:a.starred?"none":"grayscale(1) opacity(0.3)"}}>⭐</span>
              <div style={{width:62,flexShrink:0,display:"flex",flexDirection:"column"}}>
                <span style={{color:"#94a3b8",fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{efFech?efFech.split("-").reverse().join("/"):"—"}</span>
                {a.hora&&<span style={{color:"#64748b",fontSize:9,marginTop:1}}>{a.hora}</span>}
              </div>
              <div style={{flex:esCom?1.6:2.4,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:11,wordBreak:"break-word"}}>{principal}</div>
                {esCom&&nombreDisplay(ctoObj)&&empObj?.nombre&&<div style={{fontSize:9,color:"#7dd3fc",marginTop:1,wordBreak:"break-word"}}>{empObj.nombre}</div>}
                {!esCom&&ctoObj&&<div style={{fontSize:9,color:"#7dd3fc",marginTop:1}}>👤 {nombreDisplay(ctoObj)}</div>}
              </div>
              {esCom&&<div style={{flex:1,minWidth:0,color:"#94a3b8",fontSize:10,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{a.tipoAccion||"—"}</div>}
              <div style={{width:62,flexShrink:0,textAlign:"right"}}>{a.prioridad&&<span style={{...S.tag(PRIOR_COLOR[a.prioridad]||"#64748b"),fontSize:7,display:"block",marginBottom:2}}>{a.prioridad}</span>}<span style={{...S.tag(col),fontSize:8}}>{efEst}</span></div>
            </div>;
          })}
        </div>;
      })()}
    </div>
    {batch&&<div onClick={()=>setBatch(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#0c0c16",border:"1px solid #1e293b",borderRadius:"16px 16px 0 0",padding:18,width:"100%",maxWidth:480,maxHeight:"80vh",overflowY:"auto"}}>
        <div style={{fontSize:14,fontWeight:800,color:GOLD,marginBottom:4}}>Editar {sel.length} actividad{sel.length===1?"":"es"}</div>
        <div style={{fontSize:10,color:"#64748b",marginBottom:12}}>Solo se cambian los campos que llenes.</div>
        <Field label="Fecha"><input type="date" style={S.inp} value={batch.fecha} onChange={e=>setBatch({...batch,fecha:e.target.value})}/></Field>
        <Field label="Estatus"><select style={S.sel} value={batch.estatus} onChange={e=>setBatch({...batch,estatus:e.target.value})}><option value="">— Sin cambio —</option>{["Programada","En Proceso","Cerrada"].map(s=><option key={s} value={s}>{s}</option>)}</select></Field>
        <Field label="Tipo de acción"><select style={S.sel} value={batch.tipoAccion} onChange={e=>setBatch({...batch,tipoAccion:e.target.value})}><option value="">— Sin cambio —</option>{(catalogos.tipoAccion||[]).map(t=><option key={t.id} value={t.nombre}>{t.nombre}</option>)}</select></Field>
        <Field label="Prioridad"><select style={S.sel} value={batch.prioridad||""} onChange={e=>setBatch({...batch,prioridad:e.target.value})}><option value="">— Sin cambio —</option>{PRIOR.map(p=><option key={p} value={p}>{p}</option>)}</select></Field>
        {(catalogos.etiqAgenda||[]).length>0&&<Field label="Orientación — agregar">
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {catalogos.etiqAgenda.map(et=>{const on=(batch.etiquetasAgregar||[]).includes(et.nombre);return <span key={et.id} style={{...S.tag(on?"#22c55e":"#334155"),cursor:"pointer",fontSize:10}} onClick={()=>setBatch(p=>({...p,etiquetasAgregar:on?(p.etiquetasAgregar||[]).filter(x=>x!==et.nombre):[...(p.etiquetasAgregar||[]),et.nombre]}))}>+ {et.nombre}</span>;})}
          </div>
        </Field>}
        {(catalogos.etiqAgenda||[]).length>0&&<Field label="Orientación — quitar">
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {catalogos.etiqAgenda.map(et=>{const on=(batch.etiquetasQuitar||[]).includes(et.nombre);return <span key={et.id} style={{...S.tag(on?"#f87171":"#334155"),cursor:"pointer",fontSize:10}} onClick={()=>setBatch(p=>({...p,etiquetasQuitar:on?(p.etiquetasQuitar||[]).filter(x=>x!==et.nombre):[...(p.etiquetasQuitar||[]),et.nombre]}))}>− {et.nombre}</span>;})}
          </div>
          <div style={{fontSize:9,color:"#475569",marginTop:5}}>Ej. para pasar de "Comercial" a "Interno": agrega Interno y quita Comercial.</div>
        </Field>}
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button style={{...S.pill(false,"#64748b"),flex:1,padding:"10px 0"}} onClick={()=>setBatch(null)}>Cancelar</button>
          <button style={{...S.pill(true,GOLD),flex:1,padding:"10px 0",fontWeight:700}} onClick={()=>{const p={};if(batch.fecha)p.fecha=batch.fecha;if(batch.estatus)p.estatus=batch.estatus;if(batch.tipoAccion)p.tipoAccion=batch.tipoAccion;if(batch.prioridad)p.prioridad=batch.prioridad;const addEt=batch.etiquetasAgregar||[];const remEt=batch.etiquetasQuitar||[];if(Object.keys(p).length||addEt.length||remEt.length){onEditActs(sel,(a)=>{const r={...p};if(addEt.length||remEt.length){let et=[...(a.etiquetasAgenda||[])];et=et.filter(x=>!remEt.includes(x));et=[...new Set([...et,...addEt])];r.etiquetasAgenda=et;}return r;});}setBatch(null);setSelMode(false);setSel([]);}}>Aplicar</button>
        </div>
      </div>
    </div>}
    <div id="ag-bottom" style={{height:1}}/>
    <div style={{position:"fixed",right:14,bottom:150,display:"flex",flexDirection:"column",gap:7,zIndex:97}}>
      <button onClick={()=>{const el=document.getElementById("ag-top");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}} style={{width:40,height:40,borderRadius:"50%",background:"rgba(16,16,30,.95)",border:"1px solid #2dd4bf66",color:"#2dd4bf",fontSize:18,cursor:"pointer",boxShadow:"0 2px 10px rgba(0,0,0,.6)"}}>↑</button>
      <button onClick={()=>{const el=document.getElementById("ag-hoy");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}} style={{width:40,height:40,borderRadius:"50%",background:"rgba(16,16,30,.95)",border:"1px solid #C9A84C88",color:GOLD,fontSize:10,fontWeight:800,cursor:"pointer",boxShadow:"0 2px 10px rgba(0,0,0,.6)"}}>Hoy</button>
      <button onClick={()=>{const el=document.getElementById("ag-bottom");if(el)el.scrollIntoView({behavior:"smooth",block:"end"});}} style={{width:40,height:40,borderRadius:"50%",background:"rgba(16,16,30,.95)",border:"1px solid #2dd4bf66",color:"#2dd4bf",fontSize:18,cursor:"pointer",boxShadow:"0 2px 10px rgba(0,0,0,.6)"}}>↓</button>
    </div>
    <button style={S.fab} onClick={()=>openAct({estatus:"Programada",fecha:hoyISO()},null)}>+</button>
  </div>;
}

/* ════════ OPORTUNIDADES ════════ */
const OPO_COLOR={"Oportunidad Identificada":"#60a5fa","Oportunidad en Preparación":"#a78bfa","Propuesta Presentada":"#fbbf24","Oportunidad Aceptada":"#2dd4bf","Oportunidad Concretada":"#22c55e","Oportunidad Rechazada":"#64748b"};
const oc=(n)=>OPO_COLOR[n]||"#64748b";
const RECUR=["Única","Mensual","Anual"];
const PROB=["Alta","Media","Baja"];
const PRIOR=["Muy Alta","Alta","Media","Baja"];
const PRIOR_COLOR={"Muy Alta":"#ef4444","Alta":"#fb923c","Media":"#fbbf24","Baja":"#64748b"};

const ENF_CFC_COLOR={Contactar:"#60a5fa",Tareas:"#a78bfa",Acciones:"#2dd4bf"};
const ENF_CFC_ICON={Contactar:"📞",Tareas:"📋",Acciones:"⚡"};
const PRIOR_RANK={"Muy Alta":0,"Alta":1,"Media":2,"Baja":3};
const PROB_COLOR={Alta:"#22c55e",Media:"#fbbf24",Baja:"#f87171"};
const ABIERTA=(o)=>o.etapa!=="Oportunidad Concretada"&&o.etapa!=="Oportunidad Rechazada"&&o.etapa!=="Oportunidad Liquidada"&&!((o.etapa||"").toLowerCase().includes("espera"));
const money=(n)=>"$"+(Number(n)||0).toLocaleString("es-MX");

function OportunidadModal({init,contactos,empresas,catalogos,productos,fixedContacto,onSave,onDelete,onClose,onCreateContacto,onCreateEmpresa}){
  const[nuevoCto,setNuevoCto]=useState(null);
  const[nuevaEmp,setNuevaEmp]=useState(null);
  const eo=catalogos.etapaOportunidad||[];
  const[f,setF]=useState(()=>{const b={recurrencia:"Única",etapa:(eo[0]?eo[0].nombre:""),...init};if(b.contactoId&&!b.contactoPrincipalId)b.contactoPrincipalId=b.contactoId;return b;});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const solName=(id)=>((catalogos.solucion||[]).find(s=>s.id===id)||{}).nombre||"";
  const aliadosDe=(sid,tipo)=>contactos.filter(c=>(c.tiposAliado||[]).includes(tipo)&&(c.solucionesAliado||[]).includes(sid));
  const pickSolucion=(sid)=>setF(p=>{
    const est=aliadosDe(sid,"Estratégico"), com=aliadosDe(sid,"Comercial");
    const n={...p,solucionId:sid||null,solucionNexus:sid?solName(sid):null};
    if(p.productoId&&!(productos||[]).some(x=>x.id===p.productoId&&x.solucionId===sid))n.productoId=null;
    if(n.aliadoEstrategicoId&&!est.some(c=>c.id===n.aliadoEstrategicoId))n.aliadoEstrategicoId=null;
    if(!n.aliadoEstrategicoId&&est.length===1)n.aliadoEstrategicoId=est[0].id;
    if(n.aliadoComercialId&&!com.some(c=>c.id===n.aliadoComercialId))n.aliadoComercialId=null;
    if(!n.aliadoComercialId&&com.length===1)n.aliadoComercialId=com[0].id;
    return n;
  });
  const pickProducto=(pid)=>setF(p=>{const pr=(productos||[]).find(x=>x.id===pid);const n={...p,productoId:pid||null};if(pr){n.montoEstimado=pr.montoNegocio??"";n.comisionEstimada=comResultProd(pr);}return n;});
  const csort=contactos.slice().sort((a,b)=>(a.nombreCompleto||"").localeCompare(b.nombreCompleto||""));
  const principal=contactos.find(c=>c.id===f.contactoPrincipalId);
  useEffect(()=>{ if(principal&&principal.empresaId&&!f.empresaId)set("empresaId",principal.empresaId); },[f.contactoPrincipalId]);
  const save=()=>{
    if(!f.concepto){alert("Indica un concepto");return;}
    if(!f.contactoPrincipalId){alert("Selecciona el contacto principal");return;}
    const data={...f};
    if(data.etapa==="Oportunidad Concretada"&&!data.fechaConcretada)data.fechaConcretada=hoyISO();
    if(!data.movIdsVinculados)data.movIdsVinculados=[];
    onSave(data);onClose();
  };
  return <div style={S.modal} onClick={onClose}><div style={S.mBox} onClick={e=>e.stopPropagation()}>
    <div style={S.mTit}>{init&&init.id?"Editar oportunidad":"Nueva oportunidad"}</div>
    <Field label="Concepto"><input style={S.inp} value={f.concepto||""} onChange={e=>set("concepto",e.target.value)} placeholder="Ej. Fianza de cumplimiento…"/></Field>
    <Field label="Contacto principal">
      <BuscaSelect opciones={csort.map(c=>({id:c.id,label:nombreDisplay(c)}))} value={f.contactoPrincipalId} onChange={v=>set("contactoPrincipalId",v)} placeholder="— Selecciona contacto —" vacioLabel="— Sin contacto —" onAdd={(nombre)=>{setNuevoCto({field:"contactoPrincipalId",nombre:nombre||null});}}/>
    </Field>
    <Field label="Contactos operativos (opcionales)">
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>
        {(f.contactosOperativosIds||[]).map(id=>{const ct=contactos.find(x=>x.id===id);return ct?<span key={id} style={{...S.tag("#64748b"),display:"flex",alignItems:"center",gap:4,fontSize:10}}>
          {nombreDisplay(ct)}
          <button style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:11,padding:0,lineHeight:1}} onClick={()=>set("contactosOperativosIds",(f.contactosOperativosIds||[]).filter(x=>x!==id))}>✕</button>
        </span>:null;})}
      </div>
      <BuscaSelect opciones={csort.filter(c=>!(f.contactosOperativosIds||[]).includes(c.id)).map(c=>({id:c.id,label:nombreDisplay(c)}))} value="" onChange={v=>{if(v)set("contactosOperativosIds",[...(f.contactosOperativosIds||[]),v]);}} placeholder="+ Agregar operativo" vacioLabel="+ Agregar operativo"/>
    </Field>
    <Field label="Empresa (opcional)">
      <BuscaSelect opciones={empresas.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).map(e=>({id:e.id,label:e.nombre}))} value={f.empresaId} onChange={v=>set("empresaId",v)} placeholder="— Sin empresa —" vacioLabel="— Sin empresa —" onAdd={(nombre)=>{setNuevaEmp({nombre:nombre||null});}} addLabel="empresa"/>
      {nuevoCto&&<div onClick={e=>e.stopPropagation()}><ContactoModal init={nuevoCto} catalogos={catalogos} empresas={empresas} onCreateEmpresa={onCreateEmpresa} onSave={(d)=>{const id=onCreateContacto(d);set(nuevoCto.field,id);setNuevoCto(null);}} onClose={()=>setNuevoCto(null)}/></div>}
      {nuevaEmp&&<div onClick={e=>e.stopPropagation()}><EmpresaModal init={nuevaEmp} catalogos={catalogos} onSave={(d)=>{const nid=onCreateEmpresa(d);set("empresaId",nid);setNuevaEmp(null);}} onClose={()=>setNuevaEmp(null)}/></div>}
    </Field>
    <Field label="Solución Nexus">
      <select style={S.sel} value={f.solucionId||""} onChange={e=>pickSolucion(e.target.value||null)}>
        <option value="">— Selecciona —</option>
        {(catalogos.solucion||[]).map(o=><option key={o.id} value={o.id}>{o.nombre}</option>)}
      </select>
    </Field>
    {f.solucionId&&(()=>{
      const sid=f.solucionId;
      const prods=(productos||[]).filter(p=>p.solucionId===sid);
      const est=aliadosDe(sid,"Estratégico"), com=aliadosDe(sid,"Comercial");
      return <>
        <Field label="Producto (de la solución)">
          <select style={S.sel} value={f.productoId||""} onChange={e=>pickProducto(e.target.value||null)}>
            <option value="">— Sin producto / captura manual —</option>
            {prods.map(p=><option key={p.id} value={p.id}>{p.tipo}{p.categoria?" · "+p.categoria:""} — {money(comResultProd(p))}</option>)}
          </select>
          {f.productoId&&<div style={{fontSize:9,color:"#2dd4bf",marginTop:3}}>Monto y comisión se tomaron del producto; ajústalos abajo si hace falta.</div>}
          {prods.length===0&&<div style={{fontSize:9,color:"#475569",marginTop:3}}>Sin productos para esta solución. Créalos en Catálogos → Productos.</div>}
        </Field>
        <div style={S.g2}>
          <Field label="Aliado estratégico">
            <select style={S.sel} value={f.aliadoEstrategicoId||""} onChange={e=>set("aliadoEstrategicoId",e.target.value||null)}>
              <option value="">— Ninguno —</option>
              {est.map(c=><option key={c.id} value={c.id}>{nombreDisplay(c)}</option>)}
            </select>
          </Field>
          <Field label="Aliado comercial">
            <select style={S.sel} value={f.aliadoComercialId||""} onChange={e=>set("aliadoComercialId",e.target.value||null)}>
              <option value="">— Ninguno —</option>
              {com.map(c=><option key={c.id} value={c.id}>{nombreDisplay(c)}</option>)}
            </select>
          </Field>
        </div>
        {est.length===0&&com.length===0&&<div style={{fontSize:9,color:"#475569",margin:"-4px 0 8px"}}>Ningún aliado asignado a esta solución (asígnalos en la pestaña Aliados).</div>}
      </>;
    })()}
    <Field label="Etapa"><CatSelect cat={catalogos.etapaOportunidad} value={f.etapa} onChange={v=>set("etapa",v)} placeholder="—"/></Field>
    <div style={S.g2}>
      <Field label="Monto estimado"><input type="number" inputMode="numeric" style={S.inp} value={f.montoEstimado||""} onChange={e=>set("montoEstimado",e.target.value)} placeholder="0"/></Field>
      <Field label="Comisión estimada"><input type="number" inputMode="numeric" style={S.inp} value={f.comisionEstimada||""} onChange={e=>set("comisionEstimada",e.target.value)} placeholder="0"/></Field>
    </div>
    <Field label="Probabilidad de cierre">
      <div style={{display:"flex",gap:6}}>
        {PROB.map(p=><button key={p} style={{...S.pill(f.probabilidad===p,PROB_COLOR[p]),flex:1}} onClick={()=>set("probabilidad",f.probabilidad===p?null:p)}>{p}</button>)}
      </div>
    </Field>
    <div style={S.g2}>
      <Field label="Fecha estimada cierre"><input type="date" style={S.inp} value={f.fechaEstimadaCierre||""} onChange={e=>set("fechaEstimadaCierre",e.target.value||null)}/></Field>
      <Field label="Recurrencia">
        <select style={S.sel} value={f.recurrencia||"Única"} onChange={e=>set("recurrencia",e.target.value)}>{RECUR.map(r=><option key={r} value={r}>{r}</option>)}</select>
      </Field>
    </div>
    <Field label="Condiciones"><textarea style={S.ta} value={f.condiciones||""} onChange={e=>set("condiciones",e.target.value||null)}/></Field>
    <Field label="Notas"><textarea style={S.ta} value={f.notas||""} onChange={e=>set("notas",e.target.value||null)}/></Field>
    <button style={S.saveB} onClick={save}>Guardar</button>
    {init&&init.id&&<button style={{...S.cancB,color:"#f87171",borderColor:"#f8717144"}} onClick={()=>{if(window.confirm("¿Eliminar esta oportunidad?")){onDelete(init.id);onClose();}}}>Eliminar oportunidad</button>}
    <button style={S.cancB} onClick={onClose}>Cancelar</button>
  </div></div>;
}

function OpoCard({o,contactos,empresas,catalogos,onTap,sinAct,actividades,onToggleFav,onEditAct}){
  const featTag=((catalogos&&catalogos.etiqAgenda)||[])[0];
  const[showActs,setShowActs]=useState(false);
  const[selAct,setSelAct]=useState(null);
  const c=contactos.find(x=>x.id===(o.contactoPrincipalId||o.contactoId));
  const op=contactos.find(x=>x.id===o.contactoOperativoId);
  const e=empresas.find(x=>x.id===o.empresaId);const col=oc(o.etapa);
  const monto=o.comisionEstimada||o.montoEstimado;
  const actsOpo=(actividades||[]).filter(a=>a.oportunidadId===o.id).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  return <div style={{...S.cCard(col),borderLeft:sinAct?`3px solid #ef4444`:`3px solid ${col}44`}}>

          <span onClick={ev=>{ev.stopPropagation();onToggleFav&&onToggleFav(o.id);}} style={{fontSize:16,cursor:"pointer",filter:o.fav?"none":"grayscale(1) opacity(0.22)",transition:"filter 0.15s"}} title={o.fav?"Quitar de favoritas":"Marcar como favorita"}>⭐</span>
          {monto?<div style={{fontSize:13,fontWeight:800,color:GOLD,whiteSpace:"nowrap"}}>{money(monto)}</div>:null}
        </div>
        {sinAct&&<span style={{fontSize:9,fontWeight:700,color:"#ef4444",background:"#ef444411",border:"1px solid #ef444433",borderRadius:6,padding:"1px 6px",whiteSpace:"nowrap"}}>⚠ Sin seguimiento</span>}
      </div>
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
      <span style={S.tag(col)}>{(o.etapa||"").replace("Oportunidad ","")}</span>
      {o.recurrencia&&<span style={S.tag("#a78bfa")}>{o.recurrencia}</span>}
      {o.probabilidad&&<span style={S.tag(PROB_COLOR[o.probabilidad])}>{o.probabilidad}</span>}
      {c&&<span style={S.tag("#94a3b8")}>{nombreDisplay(c)}</span>}
      {(()=>{const ops=(o.contactosOperativosIds||[o.contactoOperativoId].filter(Boolean)).map(id=>contactos.find(x=>x.id===id)).filter(Boolean);
        if(ops.length===0)return null;

      })()}

      {(()=>{const nm=(((catalogos&&catalogos.solucion)||[]).find(s=>s.id===o.solucionId)||{}).nombre||o.solucionNexus;return nm?<span style={S.tag(GOLD)}>{nm.length>22?nm.slice(0,22)+"…":nm}</span>:null;})()}
      {o.aliadoEstrategicoId&&(()=>{const ae=contactos.find(x=>x.id===o.aliadoEstrategicoId);return ae?<span style={S.tag("#2dd4bf")}>🤝 {ae.nombreCompleto}</span>:null;})()}
    </div>

    {actsOpo.length>0&&<button style={{...S.pill(showActs,"#a78bfa"),padding:"3px 10px",fontSize:10,fontWeight:700,marginTop:8,width:"100%"}} onClick={e=>{e.stopPropagation();setShowActs(v=>!v);}}>📋 {actsOpo.length} actividad{actsOpo.length!==1?"es":""} {showActs?"▲":"▾"}</button>}
    {showActs&&<div style={{marginTop:8,borderTop:"1px solid #1e293b",paddingTop:8}}>
      {actsOpo.map(a=>{const col2=EST_COLOR[a.estatus||"Programada"]||"#64748b";const cto=contactos.find(x=>x.id===a.contactoId);return<div key={a.id} style={{padding:"6px 0",borderBottom:"1px solid #0f172a",cursor:"pointer"}} onClick={e=>{e.stopPropagation();setSelAct(a);}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>

            <div style={{fontSize:9,color:"#64748b",marginTop:1}}>{a.fecha?a.fecha.split("-").reverse().join("/"):"sin fecha"}{a.hora?" · "+a.hora:""}{cto?" · "+nombreDisplay(cto):""}</div>
          </div>
          <span style={{...S.tag(col2),fontSize:8,flexShrink:0}}>{proyEstatus(a)}</span>
        </div>
        {(()=>{const hInt=a.intencion||a.intencionResultado||"";const hAcc=a.accionProceso||"";const hRes=a.resultado||"";const cut=(t)=>t.length>220?t.slice(0,220)+"…":t;return(<>
          {hInt&&<div style={{fontSize:10,color:"#94a3b8",lineHeight:1.35,wordBreak:"break-word",marginTop:4}}>{cut(hInt)}</div>}
          {hAcc&&<div style={{fontSize:10,color:"#60a5fa",lineHeight:1.35,wordBreak:"break-word",marginTop:3}}>▸ {cut(hAcc)}</div>}
          {hRes&&<div style={{fontSize:10,color:"#22c55e",lineHeight:1.35,wordBreak:"break-word",marginTop:3}}>→ {cut(hRes)}</div>}
        </>);})()}

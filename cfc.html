<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#080810"/>
  <title>Nexus Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#080810;color:#e2e8f0;font-family:'DM Sans',sans-serif;overscroll-behavior:none;}
    #root{min-height:100vh;}
    #loading{position:fixed;inset:0;background:#080810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px;transition:opacity .3s ease;}
    #loading.fade-out{opacity:0;}
    #loading .isotipo-wrap{margin-bottom:20px;mix-blend-mode:screen;}
    #loading .ncfp-title{font-size:28px;font-weight:700;letter-spacing:6px;color:#C9A84C;margin-bottom:3px;font-family:'Cinzel',Georgia,serif;text-transform:uppercase;}
    #loading .ncfp-by{font-size:9px;color:#C9A84C88;letter-spacing:3px;margin-bottom:5px;text-transform:uppercase;font-family:'Cinzel',Georgia,serif;}
    #loading .ncfp-sub{font-size:9px;color:#334155;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;}
    #loading .ncfp-dots{display:flex;gap:6px;margin-top:12px;}
    #loading .ncfp-dots span{width:5px;height:5px;border-radius:50%;background:#C9A84C;animation:dotpulse 1.2s ease-in-out infinite;}
    #loading .ncfp-dots span:nth-child(2){animation-delay:.2s;}
    #loading .ncfp-dots span:nth-child(3){animation-delay:.4s;}
    @keyframes dotpulse{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1.2);}}
    input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6);}
    select option{background:#13131f;}
    ::-webkit-scrollbar{width:0;height:0;}
    input,select,button,textarea{font-family:'DM Sans',sans-serif;}
  </style>

</head>

const {useState,useEffect,useMemo,useCallback,useRef}=React;

/* ─── persistencia ─── */
const PFX='nexus_crm_';
function loadLS(k,f){try{const v=localStorage.getItem(PFX+k);return v?JSON.parse(v):f;}catch(e){return f;}}
function saveLS(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}}

const SEED=window.NEXUS_SEED||{catalogos:{},empresas:[],contactos:[]};
const SOL_ANCLA=[
  {v:"Est Fiscal",l:"Estrategia Fiscal"},{v:"Fianzas",l:"Fianzas"},
  {v:"Regulacion PLD",l:"Regulación PLD"},{v:"Gestion Financiamiento",l:"Gestión Financiamiento"},
  {v:"Seguro Flotillas",l:"Seguro Flotillas"},{v:"Consultoria Seguridad",l:"Consultoría Seguridad"},
  {v:"Seguro Vida",l:"Seguro Vida"},{v:"Less Salt",l:"Less Salt"},
];

/* migración de escalas codificadas a texto del catálogo (idempotente) */
const AA_IDS=["c68","c160","c203","c264","c320","c349","c520"];
const CAP_MAP={AA:"Muy Alta",A:"Alta",B:"Media",C:"Baja"};
const CER_MAP={AA:"Muy Cercano",A:"Cercano",B:"Medianamente Cercano",C:"No Cercano"};
function migra(cs){return (cs||[]).map(c=>({...c,
  capacidadRef: CAP_MAP[c.capacidadRef]||c.capacidadRef,
  cercania: CER_MAP[c.cercania]||c.cercania }));}

const LOW_WORDS=["de","del","la","las","los","y","e","da","do"];
function titleCase(s){
  if(!s)return s;
  return String(s).toLowerCase().split(/\s+/).filter(Boolean).map((w,i)=>
    (i>0&&LOW_WORDS.includes(w))?w:(w.charAt(0).toUpperCase()+w.slice(1))
  ).join(" ");
}

function exportBackup(contactos,empresas,oportunidades,catalogos,productos){
  try{
    const cs=contactos.map(c=>({Nombre:c.nombreCompleto,Alias:c.alias||"",Actividad:c.actividad||"",
      Empresa:((empresas.find(e=>e.id===c.empresaId)||{}).nombre)||"",Rol:c.rolEmpresa||"",
      Telefono:c.telefono||"",Correo:c.correo||"",Circulo:c.circulo||"",Relacion:c.relacion||"",
      NivelDeCercania:c.cercania||"",NivelEconomico:c.nivelEconomico||"",Potencial:c.potencial||"",CapacidadReferidor:c.capacidadRef||"",
      EtapaPrincipal:c.etapaPrincipal||"",EtapaEspecifica:c.etapaEspecifica||"",TipoPersona:c.tipoPersona||"",
      Giros:(c.giros||[]).join(", "),GiroPrincipal:c.giroPrincipal||"",SolucionesAncla:(c.solucionesAncla||[]).map(id=>(((catalogos&&catalogos.solucion)||[]).find(s=>s.id===id)||{}).nombre||id).join(", "),
      AcercamientoPixan:c.acercamientoPixan?"Sí":"No",EtapaPixan:c.etapaPixan||"",
      TipoAliado:(c.tiposAliado||[]).join(", "),EstatusAliado:c.estatusAliado||"",SolucionesAliado:(c.solucionesAliado||[]).map(id=>(((catalogos&&catalogos.solucion)||[]).find(s=>s.id===id)||{}).nombre||id).join(", "),CondicionesComision:c.esquemaParticipacion||"",AvanceTrato:c.avanceTrato||"",
      UltimoContacto:c.fechaUltimoContacto||"",ResumenAvance:c.resumenAvance||"",Observaciones:c.obs||""}));
    const es=empresas.map(e=>({Nombre:e.nombre,Giro:e.giro||"",Tamano:e.tamano||"",Telefono:e.telefono||"",Correo:e.correo||"",Domicilio:e.domicilio||"",Observaciones:e.obs||""}));
    const os=(oportunidades||[]).map(o=>({Concepto:o.concepto,Contacto:((contactos.find(c=>c.id===(o.contactoPrincipalId||o.contactoId))||{}).nombreCompleto)||"",
      Empresa:((empresas.find(e=>e.id===o.empresaId)||{}).nombre)||"",Solucion:(((catalogos&&catalogos.solucion)||[]).find(s=>s.id===o.solucionId)||{}).nombre||o.solucionNexus||"",
      Producto:((productos||[]).find(p=>p.id===o.productoId)||{}).tipo||"",
      AliadoEstrategico:((contactos.find(c=>c.id===o.aliadoEstrategicoId)||{}).nombreCompleto)||"",
      AliadoComercial:((contactos.find(c=>c.id===o.aliadoComercialId)||{}).nombreCompleto)||"",
      Etapa:o.etapa||"",
      MontoEstimado:Number(o.montoEstimado)||0,ComisionEstimada:Number(o.comisionEstimada)||0,Probabilidad:o.probabilidad||"",
      FechaEstimadaCierre:o.fechaEstimadaCierre||"",Recurrencia:o.recurrencia||"",FechaConcretada:o.fechaConcretada||"",
      Condiciones:o.condiciones||"",Notas:o.notas||""}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cs),"Contactos");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(es),"Empresas");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(os.length?os:[{Concepto:""}]),"Oportunidades");
    XLSX.writeFile(wb,"Nexus_CFC_respaldo.xlsx");
  }catch(e){alert("No se pudo exportar: "+e.message);}
}

/* ─── helpers UI ─── */
function Field({label,children}){return <div style={S.fg}><label style={S.fl}>{label}</label>{children}</div>;}
function DictadoBtn({onResult}){
  const[listening,setListening]=useState(false);
  const recRef=useRef(null);
  const toggle=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Tu navegador no soporta dictado por voz. Usa Chrome en Android.");return;}
    if(listening){recRef.current&&recRef.current.stop();setListening(false);return;}
    const rec=new SR();
    rec.lang="es-MX";rec.continuous=true;rec.interimResults=false;
    rec.onresult=(e)=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)t+=e.results[i][0].transcript;}if(t.trim())onResult(t.trim());};
    rec.onend=()=>setListening(false);rec.onerror=()=>setListening(false);
    try{rec.start();recRef.current=rec;setListening(true);}catch(err){setListening(false);}
  };
  return <button type="button" onClick={toggle} title={listening?"Detener dictado":"Dictar por voz"} style={{border:"none",background:listening?"#ef4444":"#334155",color:"#fff",borderRadius:20,width:26,height:26,fontSize:12,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{listening?"⏹":"🎤"}</button>;
}
const LblVoz=(texto,onDictado)=><span style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}><span>{texto}</span><DictadoBtn onResult={onDictado}/></span>;
function CatSelect({cat,value,onChange,placeholder}){
  return <select style={S.sel} value={value||""} onChange={e=>onChange(e.target.value||null)}>

}
function ChipMulti({opts,sel,setSel,color}){
  return <div style={{...S.chips,flexWrap:"wrap",overflowX:"visible"}}>
    {opts.map(o=>{const v=typeof o==="string"?o:o.nombre;const c=typeof color==="function"?color(v):color;
      return <span key={v} style={S.chip(sel.includes(v),c)} onClick={()=>setSel(sel.includes(v)?sel.filter(x=>x!==v):[...sel,v])}>{v}</span>;})}

}

function BuscaSelect({opciones,value,onChange,placeholder,vacioLabel,onAdd,addLabel="contacto"}){
  const[abierto,setAbierto]=useState(false);const[q,setQ]=useState("");
  const sel=opciones.find(o=>o.id===value);
  const filt=opciones.filter(o=>!q||(o.label||"").toLowerCase().includes(q.toLowerCase()));
  return <div style={{position:"relative"}}>
    <div style={{...S.sel,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>{setAbierto(a=>!a);setQ("");}}>
      <span style={{color:sel?"#e2e8f0":"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sel?sel.label:(placeholder||"— Selecciona —")}</span>
      <span style={{color:"#64748b",fontSize:11,flexShrink:0,marginLeft:6}}>{abierto?"▲":"▼"}</span>
    </div>
    {abierto&&<div style={{marginTop:4,border:"1px solid #1e293b",borderRadius:8,background:"#0d0d16",overflow:"hidden"}}>
      <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar…" style={{width:"100%",boxSizing:"border-box",background:"#10101e",border:"none",borderBottom:"1px solid #1e293b",color:"#e2e8f0",fontSize:12,padding:"9px 10px",outline:"none"}}/>
      {onAdd&&<div onClick={()=>{const nombre=q.trim();const r=onAdd(nombre);setAbierto(false);if(r){onChange(r);}}} style={{padding:"10px",fontSize:12,color:"#C9A84C",cursor:"pointer",borderBottom:"1px solid #1e293b",fontWeight:700,textAlign:"center",background:"#15151f"}}>{q.trim()?`+ Crear ${addLabel} «${q.trim()}»`:`+ Nuevo ${addLabel}`}</div>}
      <div style={{maxHeight:210,overflowY:"auto"}}>
        <div style={{padding:"8px 10px",fontSize:12,color:"#64748b",cursor:"pointer",borderBottom:"1px solid #14141f"}} onClick={()=>{onChange(null);setAbierto(false);}}>{vacioLabel||"— Ninguno —"}</div>
        {filt.map(o=><div key={o.id} onClick={()=>{onChange(o.id);setAbierto(false);}} style={{padding:"8px 10px",fontSize:12,cursor:"pointer",borderBottom:"1px solid #14141f",color:o.id===value?"#2dd4bf":"#e2e8f0",fontWeight:o.id===value?700:400}}>{o.label}</div>)}
        {filt.length===0&&<div style={{padding:"10px",fontSize:11,color:"#475569"}}>Sin coincidencias.</div>}
      </div>
    </div>}
  </div>;
}

          <div style={S.g2}>
            <Field label="Fecha último contacto"><input type="date" style={S.inp} value={f.fechaUltimoContacto||""} onChange={e=>set("fechaUltimoContacto",e.target.value||null)}/></Field>
            <Field label="¿Presentación Nexus?">
              <div style={{display:"flex",gap:6}}>
                <button style={{...S.pill(f.cuentaPresentacion,"#22c55e"),flex:1}} onClick={()=>set("cuentaPresentacion",true)}>Sí</button>

              </div>

          </div>

          <div style={S.g2}>
            <Field label="¿Acercamiento previo?">
              <div style={{display:"flex",gap:6}}>

                <button style={{...S.pill(!f.acercamientoPixan),flex:1}} onClick={()=>set("acercamientoPixan",false)}>No</button>
              </div>

          </div>
        </>
        : <div style={{fontSize:10,color:"#475569",padding:"8px 10px",background:"#0f172a",borderRadius:8,border:"1px solid #1e293b",marginTop:8}}>Las secciones de información relacional, perfil estratégico y avance aparecen cuando el tipo incluye <b style={{color:"#7dd3fc"}}>Prospecto</b>.</div>
      }

      <Field label="Observaciones generales"><textarea style={S.ta} value={f.obs||""} onChange={e=>set("obs",e.target.value||null)}/></Field>

      <button style={S.saveB} onClick={save}>Guardar</button>
      <button style={S.cancB} onClick={onClose}>Cancelar</button>
    </div>
    {nuevaEmp&&<div onClick={e=>e.stopPropagation()}>

        onSave={(d)=>{const nid=onCreateEmpresa(d);if(nuevaEmp&&nuevaEmp._row!=null)setEmpRow(nuevaEmp._row,"empresaId",nid);else setEmps([...empList,{empresaId:nid,rol:""}]);setNuevaEmp(null);}}
        onClose={()=>setNuevaEmp(null)}/>
    </div>}
  </div>;
}

/* ════════ DETALLE CONTACTO ════════ */

        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {c.solucionesAncla.map(v=>{const s=(catalogos.solucion||[]).find(x=>x.id===v);return <span key={v} style={S.tag(GOLD)}>{s?s.nombre:v}</span>;})}
        </div>
      </div>}

      {(c.tiposAliado&&c.tiposAliado.length>0)&&<div style={S.card("#2dd4bf44")}>
        <div style={S.sTit}>Alianza · {c.tiposAliado.join(" + ")}{c.estatusAliado?` — ${c.estatusAliado}`:""}</div>
        {(c.solucionesAliado||[]).length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
          {c.solucionesAliado.map(id=>{const s=(catalogos.solucion||[]).find(x=>x.id===id);return <span key={id} style={S.tag("#2dd4bf")}>{s?s.nombre:id}</span>;})}

        {(c.solucionesAliado||[]).length===0&&!c.esquemaParticipacion&&!c.avanceTrato&&<div style={{fontSize:11,color:"#475569"}}>Sin soluciones ni condiciones registradas. Edita para completarlas.</div>}
      </div>}

      {c.obs&&<div style={S.card()}><div style={S.sTit}>Observaciones</div><div style={{fontSize:12,color:"#94a3b8",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{c.obs}</div></div>}

      <div style={S.card()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <button style={{...S.pill(showOpps,"#fbbf24"),fontWeight:700,fontSize:10}} onClick={()=>setShowOpps(v=>!v)}>
            🚀 Oportunidades ({(oportunidades||[]).filter(o=>o.contactoPrincipalId===c.id||o.contactoId===c.id||(o.contactosOperativosIds||[o.contactoOperativoId].filter(Boolean)).includes(c.id)).length}) {showOpps?"▲":"▾"}
          </button>
          <button style={S.pill(true,"#fbbf24")} onClick={()=>onAddOpo(c.id)}>+ Detonar</button>
        </div>
        {showOpps&&<div style={{marginTop:10}}>
          {(oportunidades||[]).filter(o=>o.contactoPrincipalId===c.id||o.contactoOperativoId===c.id||o.contactoId===c.id).map(o=><OpoCard key={o.id} o={o} contactos={contactos} empresas={empresas} catalogos={catalogos} onTap={(x)=>onEditOpo(x)}/>)}
          {(oportunidades||[]).filter(o=>o.contactoPrincipalId===c.id||o.contactoId===c.id||(o.contactosOperativosIds||[o.contactoOperativoId].filter(Boolean)).includes(c.id)).length===0&&<div style={{fontSize:11,color:"#475569",marginTop:6}}>Sin oportunidades aún.</div>}
        </div>}

      <div style={S.card()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <button style={{...S.pill(showActs,GOLD),fontWeight:700,fontSize:10}} onClick={()=>setShowActs(v=>!v)}>
            📋 Agenda CFC ({(actividades||[]).filter(a=>a.contactoId===c.id).length}) {showActs?"▲":"▾"}
          </button>
          <button style={S.pill(true,GOLD)} onClick={()=>onAddAct(c.id)}>+ Registrar</button>
        </div>
        {showActs&&<div style={{marginTop:10}}>
          <ActividadesList acts={(actividades||[]).filter(a=>a.contactoId===c.id)} contactos={[c]} showContacto={false} onTap={(a)=>onEditAct(a)} onEdit={onEditActForm}/>
        </div>}
      </div>
      {(()=>{
        try{
          const napActs=JSON.parse(localStorage.getItem("nap_actividades")||"[]");
          const napCto=napActs.filter(a=>a.contactoId===c.id);
          if(!napCto.length)return null;
          return <div style={{...S.card(),borderColor:"#a78bfa44"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <button style={{...S.pill(showActsNAP,"#a78bfa"),fontWeight:700,fontSize:10}} onClick={()=>setShowActsNAP(v=>!v)}>
                📋 Agenda Personal ({napCto.length}) {showActsNAP?"▲":"▾"}
              </button>
            </div>
            {showActsNAP&&<div style={{marginTop:10}}>
              {napCto.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(a=><div key={a.id} style={{padding:"7px 0",borderBottom:"1px solid #0f172a"}}>
                <div style={{fontSize:11,fontWeight:600,color:"#a78bfa"}}>{a.asunto||a.tipoAccion||"Actividad"}</div>
                <div style={{fontSize:9,color:"#64748b"}}>{a.fecha?a.fecha.split("-").reverse().join("/"):"sin fecha"}{a.hora?" · "+a.hora:""} · {a.estatus||"Programada"}</div>
              </div>)}
            </div>}
          </div>;
        }catch(e){return null;}
      })()}

      <button style={{...S.cancB,color:"#f87171",borderColor:"#f8717144"}} onClick={onDelete}>Eliminar contacto</button>
    </div>
  </div>;
}

/* ════════ LISTA CONTACTOS ════════ */
function Contactos({initialSel,contactos,catalogos,setCatalogos,empresas,setEmpresas,setContactos,actividades,openAct,verAct,oportunidades,openOpo,aliadosOnly,onBack}){
  const[q,setQ]=useState("");
  const[fEtapa,setFEtapa]=useState([]);
  const[fEsp,setFEsp]=useState([]);
  const[fGiro,setFGiro]=useState([]);
  const[fSol,setFSol]=useState([]);
  const[fEtiq,setFEtiq]=useState([]);
  const[fPot,setFPot]=useState([]);
  const[fCer,setFCer]=useState([]);
  const[fEco,setFEco]=useState([]);
  const[fTipo,setFTipo]=useState([]);
  const[fPres,setFPres]=useState("");
  const[fPix,setFPix]=useState("");
  const[fEsAliado,setFEsAliado]=useState("");
  const[fTipoAliado,setFTipoAliado]=useState([]);
  const[fEstatusAliado,setFEstatusAliado]=useState([]);
  const[fSolAliado,setFSolAliado]=useState([]);
  const[panel,setPanel]=useState(false);
  const[sel,setSel]=useState(initialSel||null);
  const[vistaAliados,setVistaAliados]=useState("aliado");
  const solName=(id)=>((catalogos.solucion||[]).find(s=>s.id===id)||{}).nombre||"";
  const[modal,setModal]=useState(null);
  const[bulkMode,setBulkMode]=useState(false);
  const[bulkSel,setBulkSel]=useState(new Set());
  const[bulkPanel,setBulkPanel]=useState(null); // objeto con los campos a editar
  const toggleBulk=(id)=>setBulkSel(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const applyBulk=(patch)=>{
    setContactos(prev=>prev.map(c=>bulkSel.has(c.id)?{...c,...patch}:c));
    setBulkSel(new Set());setBulkMode(false);setBulkPanel(null);
  };
  const createEmpresa=(d)=>{const nid="e"+(Math.max(0,...empresas.map(e=>parseInt((e.id||"e0").slice(1))||0))+1);setEmpresas(prev=>[...prev,{...d,id:nid}]);return nid;};
  useEffect(()=>{ if(fEsp.length&&fEtapa.length) setFEsp(prev=>prev.filter(n=>(catalogos.etapaEspecifica||[]).some(e=>e.nombre===n&&fEtapa.includes(e.principal)))); },[fEtapa]);

  const list=useMemo(()=>contactos.filter(c=>{
    const esAliado=!!(c.tiposAliado&&c.tiposAliado.length);
    if(aliadosOnly&&!esAliado)return false;
    if(q){const ql=q.toLowerCase();const match=(c)=>{
      if((c.nombreCompleto||"").toLowerCase().includes(ql))return true;
      if((c.alias||"").toLowerCase().includes(ql))return true;
      if((c.prefijo||"").toLowerCase().includes(ql))return true;
      if((c.actividad||"").toLowerCase().includes(ql))return true;
      // empresa: revisar tanto array de empresas como empresaId directo
      const empIds=[...((c.empresas||[]).map(r=>r.empresaId)),c.empresaId].filter(Boolean);
      if(empIds.some(eid=>{const e=empresas.find(x=>x.id===eid);return e&&(e.nombre||"").toLowerCase().includes(ql);}))return true;
      return false;
    };if(!match(c))return false;}
    if(fEtapa.length&&!fEtapa.includes(c.etapaPrincipal))return false;
    if(fEsp.length&&!fEsp.includes(c.etapaEspecifica))return false;
    if(fGiro.length&&!(c.giros||[]).some(g=>fGiro.includes(g)))return false;
    if(fSol.length&&!(c.solucionesAncla||[]).some(s=>fSol.includes(s)))return false;
    if(fEtiq.length&&!(c.etiquetas||[]).some(e=>fEtiq.includes(e)))return false;
    if(fPot.length&&!fPot.includes(c.potencial))return false;
    if(fCer.length&&!fCer.includes(c.cercania))return false;
    if(fEco.length&&!fEco.includes(c.nivelEconomico))return false;
    if(fTipo.length&&!fTipo.some(t=>(c.tiposContacto||[c.tipoContacto].filter(Boolean)).includes(t)))return false;
    if(fEsAliado&&(esAliado?"si":"no")!==fEsAliado)return false;
    if(fTipoAliado.length&&!(c.tiposAliado||[]).some(t=>fTipoAliado.includes(t)))return false;
    if(fEstatusAliado.length&&!fEstatusAliado.includes(c.estatusAliado))return false;
    if(fSolAliado.length&&!(c.solucionesAliado||[]).some(s=>fSolAliado.includes(s)))return false;
    if(fPres&&(c.cuentaPresentacion?"si":"no")!==fPres)return false;
    if(fPix&&(c.acercamientoPixan?"si":"no")!==fPix)return false;
    return true;
  }).sort((a,b)=>(a.nombreCompleto||"").localeCompare(b.nombreCompleto||"")),[contactos,q,fEtapa,fEsp,fGiro,fSol,fEtiq,fPot,fCer,fEco,fTipo,fEsAliado,fTipoAliado,fEstatusAliado,fSolAliado,fPres,fPix,aliadosOnly]);
  const activos=[...fEtapa,...fEsp,...fGiro,...fSol,...fEtiq,...fPot,...fCer,...fEco,...fTipo,...fTipoAliado,...fEstatusAliado,...fSolAliado].length+(fPres?1:0)+(fPix?1:0)+(fEsAliado?1:0);
  const limpiar=()=>{setFEtapa([]);setFEsp([]);setFGiro([]);setFSol([]);setFEtiq([]);setFPot([]);setFCer([]);setFEco([]);setFTipo([]);setFEsAliado("");setFTipoAliado([]);setFEstatusAliado([]);setFSolAliado([]);setFPres("");setFPix("");};
  const espOpts=fEtapa.length?(catalogos.etapaEspecifica||[]).filter(e=>fEtapa.includes(e.principal)):(catalogos.etapaEspecifica||[]);

  const save=(data)=>{
    if(data.actividad){const ex=(catalogos.actividadPrincipal||[]).some(o=>(o.nombre||"").toLowerCase()===data.actividad.toLowerCase());
      if(!ex&&setCatalogos)setCatalogos(p=>({...p,actividadPrincipal:[...(p.actividadPrincipal||[]),{id:"act"+Date.now(),nombre:data.actividad}]}));}
    setContactos(prev=>{
      if(data.id)return prev.map(c=>c.id===data.id?data:c);
      const nid="c"+(Math.max(0,...prev.map(c=>parseInt((c.id||"c0").slice(1))||0))+1);
      return [...prev,{...data,id:nid}];
    });
    setModal(null);
  };
  const del=(id)=>{ if(window.confirm("¿Eliminar este contacto?")){setContactos(prev=>prev.filter(c=>c.id!==id));setSel(null);} };

  if(sel){
    const c=contactos.find(x=>x.id===sel);
    if(!c){setSel(null);return null;}
    return <>
      <ContactoDetalle c={c} contactos={contactos} catalogos={catalogos} empresas={empresas} actividades={actividades} oportunidades={oportunidades}
        onAddAct={(cid)=>openAct({contactoId:cid,estatus:"Programada",fecha:hoyISO()},cid)}
        onEditAct={(a)=>verAct?verAct(a):openAct(a,a.contactoId)} onEditActForm={(a)=>openAct(a,a.contactoId)}
        onAddOpo={(cid)=>openOpo({contactoPrincipalId:cid},cid)}
        onEditOpo={(o)=>openOpo(o,o.contactoPrincipalId||o.contactoId)}
        onEdit={()=>setModal(c)} onDelete={()=>del(c.id)} onBack={()=>setSel(null)}/>
      {modal&&<ContactoModal init={modal} catalogos={catalogos} empresas={empresas} onCreateEmpresa={createEmpresa} onSave={save} onClose={()=>setModal(null)}/>}
    </>;
  }

  return <div>
    {aliadosOnly&&onBack&&<div style={S.sec}><button style={S.back} onClick={onBack}>‹ Configuración</button></div>}
    <div style={S.hdr}><div><div style={S.logo}>{aliadosOnly?"Aliados":"Contactos"}</div><div style={S.sub}>{aliadosOnly?`${list.length} aliado${list.length===1?"":"s"} registrado${list.length===1?"":"s"}`:`${list.length} de ${contactos.length}`}</div></div></div>
    {aliadosOnly&&<div style={{display:"flex",gap:6,padding:"10px 16px 0"}}>
      <button style={{...S.pill(vistaAliados==="aliado","#2dd4bf"),flex:1,padding:"8px 0",fontWeight:700}} onClick={()=>setVistaAliados("aliado")}>Por aliado</button>
      <button style={{...S.pill(vistaAliados==="solucion","#2dd4bf"),flex:1,padding:"8px 0",fontWeight:700}} onClick={()=>setVistaAliados("solucion")}>Por solución</button>
    </div>}
    <div style={S.line}/>
    <div style={S.sec}>
      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
        <input style={{...S.srch,flex:1}} placeholder="🔍 Buscar por nombre…" value={q} onChange={e=>setQ(e.target.value)}/>
        <button style={{...S.pill(panel||activos>0,GOLD),padding:"9px 12px",fontWeight:700,flexShrink:0,whiteSpace:"nowrap"}} onClick={()=>setPanel(p=>!p)}>⚙{activos>0?` (${activos})`:""} {panel?"▲":"▾"}</button>
        {activos>0&&<button style={{...S.pill(false,"#f87171"),flexShrink:0}} onClick={limpiar}>✕</button>}
        <span style={{fontSize:9,color:"#475569",flexShrink:0,whiteSpace:"nowrap"}}>Act: {list.length}</span>
        {!aliadosOnly&&<button style={{...S.pill(bulkMode,"#a78bfa"),flexShrink:0,padding:"9px 10px",fontWeight:700,fontSize:10}} onClick={()=>{setBulkMode(v=>!v);setBulkSel(new Set());setBulkPanel(null);}}>☑</button>}
      </div>
      {bulkMode&&<div style={{...S.card(),marginBottom:8,padding:"10px 12px"}}>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:"#94a3b8"}}>{bulkSel.size} seleccionado{bulkSel.size!==1?"s":""}</span>

function EmpresaModal({init,catalogos,onSave,onClose}){
  const[f,setF]=useState(()=>({...init}));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return <div style={S.modal} onClick={onClose}><div style={S.mBox} onClick={e=>e.stopPropagation()}>
    <div style={S.mTit}>{init.id?"Editar empresa":"Nueva empresa"}</div>
    <Field label="Nombre"><input style={S.inp} value={f.nombre||""} onChange={e=>set("nombre",e.target.value)}/></Field>
    <div style={S.g2}>
      <Field label="Giro"><CatSelect cat={catalogos.giro} value={f.giro} onChange={v=>set("giro",v)}/></Field>
      <Field label="Tamaño"><CatSelect cat={catalogos.tamanoEmpresa} value={f.tamano} onChange={v=>set("tamano",v)}/></Field>
    </div>
    <div style={S.g2}>
      <Field label="Teléfono"><input style={S.inp} value={f.telefono||""} onChange={e=>set("telefono",e.target.value||null)}/></Field>
      <Field label="Correo"><input style={S.inp} value={f.correo||""} onChange={e=>set("correo",e.target.value||null)}/></Field>
    </div>
    <Field label="Domicilio"><input style={S.inp} value={f.domicilio||""} onChange={e=>set("domicilio",e.target.value||null)}/></Field>
    <Field label="Observaciones"><textarea style={S.ta} value={f.obs||""} onChange={e=>set("obs",e.target.value||null)}/></Field>
    <button style={S.saveB} onClick={()=>{if(!f.nombre){alert("Nombre obligatorio");return;}onSave(f);}}>Guardar</button>
    <button style={S.cancB} onClick={onClose}>Cancelar</button>
  </div></div>;
}
function Empresas({empresas,setEmpresas,contactos,catalogos,goContacto}){
  const[sel,setSel]=useState(null);const[modal,setModal]=useState(null);const[q,setQ]=useState("");
  const save=(d)=>{setEmpresas(prev=>{if(d.id)return prev.map(e=>e.id===d.id?d:e);const nid="e"+(Math.max(0,...prev.map(e=>parseInt((e.id||"e0").slice(1))||0))+1);return[...prev,{...d,id:nid}];});setModal(null);};
  const del=(e)=>{const n=contactos.filter(c=>cEmpresas(c).some(x=>x.empresaId===e.id)).length;
    if(n>0){alert(`Esta empresa tiene ${n} contacto(s) vinculado(s). Desvincúlalos o reasígnalos primero (desde cada contacto, en "Empresa vinculada").`);return;}
    if(window.confirm("¿Eliminar esta empresa? Esta acción no se puede deshacer."))
      {setEmpresas(prev=>prev.filter(x=>x.id!==e.id));setSel(null);}};
  const list=empresas.filter(e=>!q||(e.nombre||"").toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  if(sel){
    const e=empresas.find(x=>x.id===sel);if(!e){setSel(null);return null;}
    const vinc=contactos.filter(c=>cEmpresas(c).some(x=>x.empresaId===e.id));
    const Row=({k,v})=>v?<div style={S.detRow}><span style={S.detK}>{k}</span><span style={S.detV}>{v}</span></div>:null;
    return <div>
      <div style={{...S.sec,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <button style={S.back} onClick={()=>setSel(null)}>‹ Empresas</button>
        <button style={S.pill(true,GOLD)} onClick={()=>setModal(e)}>Editar</button>
      </div>
      <div style={S.sec}>
        <div style={{fontSize:20,fontWeight:800,marginBottom:6}}>{e.nombre}</div>
        <div style={S.card()}>
          <Row k="Giro" v={e.giro}/><Row k="Tamaño" v={e.tamano}/><Row k="Teléfono" v={e.telefono}/>
          <Row k="Correo" v={e.correo}/><Row k="Domicilio" v={e.domicilio}/>
          {e.obs&&<div style={{fontSize:12,color:"#94a3b8",marginTop:8,lineHeight:1.5}}>{e.obs}</div>}
        </div>
        <div style={S.card()}>
          <div style={S.sTit}>Contactos vinculados ({vinc.length})</div>
          {vinc.map(c=><div key={c.id} onClick={()=>goContacto(c.id)} style={{...S.detRow,cursor:"pointer"}}>
            <span style={{fontWeight:600}}>{nombreDisplay(c)}</span><span style={{...S.detK}}>{(cEmpresas(c).find(x=>x.empresaId===e.id)||{}).rol||""}</span></div>)}
          {vinc.length===0&&<div style={{fontSize:11,color:"#475569"}}>Aún sin contactos vinculados.</div>}
        </div>
        <button style={{...S.cancB,color:"#f87171",borderColor:"#f8717144"}} onClick={()=>del(e)}>Eliminar empresa</button>
      </div>
      {modal&&<EmpresaModal init={modal} catalogos={catalogos} onSave={save} onClose={()=>setModal(null)}/>}
    </div>;
  }
  return <div>
    <div style={S.hdr}><div><div style={S.logo}>Empresas</div><div style={S.sub}>{empresas.length} registradas</div></div></div>
    <div style={S.line}/>
    <div style={S.sec}>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <input style={{...S.srch,flex:1}} placeholder="🔍 Buscar empresa…" value={q} onChange={e=>setQ(e.target.value)}/>
        <span style={{fontSize:9,color:"#475569",whiteSpace:"nowrap"}}>Act: {list.length}</span>
      </div>
    </div>
    <div style={{...S.sec,paddingTop:8}}>
      {list.map(e=>{const n=contactos.filter(c=>cEmpresas(c).some(x=>x.empresaId===e.id)).length;return(
        <div key={e.id} style={S.cCard("#3b82f6")} onClick={()=>setSel(e.id)}>
          <div style={{fontSize:14,fontWeight:700}}>{e.nombre}</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
            {e.giro&&<span style={S.tag("#3b82f6")}>{e.giro}</span>}
            {e.tamano&&<span style={S.tag("#64748b")}>{e.tamano}</span>}
            <span style={S.tag("#a78bfa")}>{n} contacto{n!==1?"s":""}</span>
          </div>
        </div>);})}
      {list.length===0&&<div style={{textAlign:"center",color:"#475569",fontSize:12,padding:"30px 0"}}>Sin empresas.</div>}
    </div>
    <button style={S.fab} onClick={()=>setModal({})}>+</button>
    {modal&&<EmpresaModal init={modal} catalogos={catalogos} onSave={save} onClose={()=>setModal(null)}/>}
  </div>;
}

function Catalogos({catalogos,setCatalogos,contactos,setContactos,onProductos,onBack}){

          setCatalogos(p=>({...p,etapaEspecifica:p.etapaEspecifica.map(o=>o.id===editEsp.id?{...o,nombre,principal:editEsp.principal||null,descripcion:editEsp.descripcion||""}:o)}));

/* ════════ OBJETIVOS (metas mensuales y proyección) ════════ */
const MESNOM=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
function mesesDesde(ini,n){const[y,m]=ini.split("-").map(Number);const a=[];let yy=y,mm=m;for(let i=0;i<n;i++){a.push(yy+"-"+String(mm).padStart(2,"0"));mm++;if(mm>12){mm=1;yy++;}}return a;}
/* Escenarios de proyección: p.metasEsc={min,des,opt}; p.metas = espejo del escenario OFICIAL (lo que leen CFP y el resto de la app) */
const ESCENARIOS=[{id:"min",nombre:"Mínimo",color:"#f87171"},{id:"des",nombre:"Deseable",color:"#60a5fa"},{id:"opt",nombre:"Optimista",color:"#22c55e"}];
const metasDe=(p,e)=>p.metasEsc?(p.metasEsc[e]||{}):(e==="des"?(p.metas||{}):{});
const asegEsc=(p)=>p.metasEsc?p.metasEsc:{min:{},des:{...(p.metas||{})},opt:{}};
function etiquetaMes(k){const[y,m]=k.split("-").map(Number);return MESNOM[m-1]+" "+String(y).slice(2);}
function Objetivos({productos,setProductos,catalogos,setCatalogos,contactos,oportunidades,onProductos}){
  const hoy=new Date();
  const[ini,setIni]=useState(()=>hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0"));
  const[nMeses,setNMeses]=useState(6);
  const[modo,setModo]=useState("matriz");
  const[ver,setVer]=useState(null);
  const[escOficial,setEscOficial]=useState(()=>loadLS("escOficial","des"));
  const[esc,setEsc]=useState(()=>loadLS("escOficial","des"));
  const escNom=(ESCENARIOS.find(x=>x.id===esc)||{}).nombre||"";
  const cambiaOficial=(e)=>{
    const nom=(ESCENARIOS.find(x=>x.id===e)||{}).nombre;
    if(!window.confirm(`CFP tomará las metas del escenario "${nom}" para su presupuesto de ingresos. ¿Continuar?`))return;
    setProductos(prev=>prev.map(p=>{const me=asegEsc(p);return {...p,metasEsc:me,metas:{...(me[e]||{})}};}));
    saveLS("escOficial",e);setEscOficial(e);
  };
  const[metaContactos,setMetaContactos]=useState(()=>loadLS("metaProspContactos",0));
  const[mesRep,setMesRep]=useState(()=>hoy.getFullYear()+"-"+String(hoy.getMonth()+1).padStart(2,"0"));
  const meses=mesesDesde(ini,nMeses);
  const setMeta=(pid,mes,val)=>setProductos(prev=>prev.map(p=>{
    if(p.id!==pid)return p;
    const me=asegEsc(p);
    const metas={...(me[esc]||{})};
    if(val===""||val===null)delete metas[mes];else metas[mes]=val;
    return {...p,metasEsc:{...me,[esc]:metas},...(esc===escOficial?{metas}:{})};
  }));
  const setLogrado=(pid,mes,val)=>setProductos(prev=>prev.map(p=>{
    if(p.id!==pid)return p;
    const logrado={...(p.logrado||{})};
    if(val===""||val===null)delete logrado[mes];else logrado[mes]=val;
    return {...p,logrado};
  }));
  const restanteMes=(p,mes)=>Math.max(0,(Number(metasDe(p,esc)[mes])||0)-(Number((p.logrado||{})[mes])||0));
  const pRec=(p)=>p.recurrencia||(p.recurrente===true?"mensual":"único"); // backward compat
  const cierreProd=(p,mes)=>restanteMes(p,mes)*comResultProd(p);
  const ingresoProdE=(p,mes,e)=>{
    const com=comResultProd(p),metas=metasDe(p,e),logrado=p.logrado||{},rec=pRec(p);
    if(rec==="mensual"){let u=0;for(const k in metas){if(k<=mes)u+=Math.max(0,(Number(metas[k])||0)-(Number(logrado[k])||0));}return u*com;}
    if(rec==="anual"){const mesM=mes.slice(5),mesY=mes.slice(0,4);let u=0;for(const k in metas){if(k.slice(5)===mesM&&k.slice(0,4)<=mesY)u+=Math.max(0,(Number(metas[k])||0)-(Number(logrado[k])||0));}return u*com;}
    return Math.max(0,(Number(metas[mes])||0)-(Number(logrado[mes])||0))*com; // único
  };
  const ingresoProd=(p,mes)=>ingresoProdE(p,mes,esc);

            </div>)}
        <div style={{fontSize:9,color:"#475569",marginTop:4,lineHeight:1.5}}>Incluye productos con meta del mes y recurrentes con acumulado vivo. El total coincide con el Ingreso Nexus Proyectado que alimenta el presupuesto del CFP.</div>

    {modo==="comparar"&&(()=>{

            <div style={{flex:1,fontSize:10,fontWeight:800,color:GOLD}}>TOTAL</div>
            {ESCENARIOS.map(e=><div key={e.id} style={{width:74,textAlign:"right",fontSize:10,fontWeight:800,color:e.color}}>{money(totPer(e.id,productos))}</div>)}
          </div>
        </div>
        <div style={{fontSize:9,color:"#475569",marginTop:10,lineHeight:1.5}}>Cada escenario calcula el <b style={{color:"#2dd4bf"}}>Ingreso proy.</b> con sus propias metas y descuenta lo ya logrado. El periodo es el que eliges arriba. ★ = escenario oficial que alimenta CFP. «Logrado (real)» es lo capturado en el mes × comisión, igual para los tres escenarios.</div>
      </div>;
    })()}
    {modo==="productos"&&(()=>{
      const shiftMes=(mk,d)=>{let a=mk.split("-").map(Number),y=a[0],m=a[1];m+=d;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+"-"+String(m).padStart(2,"0");};
      const grupos=sols.map(g=>{const items=g.prods.map(p=>({p,meta:Number(metasDe(p,esc)[mesRep])||0,logr:Number((p.logrado||{})[mesRep])||0})).filter(x=>x.meta>0);return {s:g.s,items};}).filter(g=>g.items.length>0);
      return <div style={S.sec}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#10101e",border:"1px solid #1e293b",borderRadius:11,padding:"8px 10px",marginBottom:12}}>
          <button onClick={()=>setMesRep(shiftMes(mesRep,-1))} style={{background:"transparent",border:"none",color:GOLD,fontSize:20,cursor:"pointer",padding:"0 12px"}}>‹</button>
          <div style={{textAlign:"center"}}><div style={{fontSize:9,color:"#64748b",letterSpacing:1}}>QUÉ VENDER ESTE MES</div><div style={{fontSize:15,fontWeight:800,color:"#e2e8f0",textTransform:"capitalize"}}>{etiquetaMes(mesRep)}</div></div>

          : grupos.map(g=><div key={g.s.id} style={{...S.card(),marginBottom:10,padding:0}}>

                  <div style={{fontSize:12,color:"#e2e8f0",fontWeight:600,wordBreak:"break-word"}}>{it.p.tipo}{it.p.categoria&&<span style={{fontSize:9,color:"#64748b",fontWeight:400}}> · {it.p.categoria}</span>}</div>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{[it.p.categoria,(it.p.montoNegocio?money(it.p.montoNegocio):null)].filter(Boolean).join(" · ")||"—"}</div>
                  {it.logr>0&&<div style={{fontSize:9,color:"#22c55e",marginTop:2}}>✓ {it.logr} logrado{it.logr>=it.meta?" — Cubierta":""}</div>}

                  <div style={{fontSize:16,fontWeight:800,color:rest===0?"#22c55e":"#a78bfa"}}>{rest}</div>

                </div>
              </div>;})}
            </div>)}
        <div style={{fontSize:9,color:"#475569",marginTop:4,lineHeight:1.5}}>Síntesis de venta del mes: producto, categoría, monto de producción y unidades meta. Sin comisiones ni proyección de ingreso.</div>
      </div>;
    })()}
  </div>;
}

function BienesInmuebles({bienes,setBienes,catalogos,contactos,onBack}){
  const EST=["Disponible","En proceso","Vinculado","Cerrado","No disponible"];
  const TIPO=["Venta directa","Coinversión"];
  const EST_COL={"Disponible":"#22c55e","En proceso":"#fbbf24","Vinculado":"#60a5fa","Cerrado":"#94a3b8","No disponible":"#64748b"};
  const money=n=>"$"+Math.round(n||0).toLocaleString("es-MX");
  const aliadosOpts=contactos.filter(c=>(c.tiposAliado||[]).length>0).map(c=>({id:c.id,label:nombreDisplay(c)})).sort((a,b)=>(a.label||"").localeCompare(b.label||""));
  const nomAliado=(id)=>{const c=contactos.find(x=>x.id===id);return c?c.nombreCompleto:"";};
  const calcCom=(f)=>((parseFloat(f.valorPropiedad)||0)*(parseFloat(f.comProp)||0)/100)+((parseFloat(f.valorInversion)||0)*(parseFloat(f.comInv)||0)/100);
  const[modal,setModal]=useState(null);
  const[q,setQ]=useState("");
  const[fEst,setFEst]=useState("");
  const[fTipo,setFTipo]=useState("");
  const set=(k,v)=>setModal(m=>({...m,[k]:v}));
  const abrir=(b)=>setModal(b?{...b}:{denominacion:"",estatus:"Disponible",tipo:"Coinversión",descripcion:"",condiciones:"",aliadoEstId:"",aliadoComId:"",valorPropiedad:"",comProp:"",valorInversion:"",comInv:"",montoComision:"",comAuto:true,ubicacion:"",superficie:"",obs:""});
  const guardar=()=>{
    if(!modal.denominacion){alert("Indica la denominación");return;}
    const auto=calcCom(modal);
    const data={...modal,montoComision:modal.comAuto!==false?auto:(parseFloat(modal.montoComision)||0)};
    setBienes(prev=>{ if(data.id)return prev.map(x=>x.id===data.id?data:x); return [...prev,{...data,id:"bi"+Date.now()}]; });
    setModal(null);
  };
  const borrar=(id)=>{ if(window.confirm("¿Eliminar este inmueble?")){setBienes(prev=>prev.filter(x=>x.id!==id));setModal(null);} };
  const lista=bienes.filter(b=>{
    if(fEst&&b.estatus!==fEst)return false;
    if(fTipo&&b.tipo!==fTipo)return false;
    if(q){const s=(b.denominacion+" "+(b.descripcion||"")+" "+(b.ubicacion||"")).toLowerCase();if(s.indexOf(q.toLowerCase())<0)return false;}
    return true;
  });
  const totalPipeline=bienes.filter(b=>b.estatus!=="Cerrado"&&b.estatus!=="No disponible").reduce((s,b)=>s+(b.montoComision||0),0);
  return <div>
    <div style={{...S.sec,display:"flex",justifyContent:"space-between",alignItems:"center"}}><button style={S.back} onClick={onBack}>‹ Configuración</button></div>
    <div style={S.sec}>
      <div style={{fontSize:17,fontWeight:800,marginBottom:2}}>🏠 Bienes Inmuebles</div>
      <div style={{fontSize:10,color:"#64748b",marginBottom:12}}>Propiedades para venta directa o coinversión.</div>
      <div style={{...S.card(),borderColor:GOLD+"55",marginBottom:12}}>
        <div style={{fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:1}}>Comisión proyectada (disponibles · en proceso · vinculados)</div>
        <div style={{fontSize:22,fontWeight:800,fontFamily:"'Cinzel',serif",color:GOLD}}>{money(totalPipeline)}</div>
      </div>
      <input style={{...S.inp,marginBottom:8}} placeholder="Buscar por denominación, descripción o ubicación…" value={q} onChange={e=>setQ(e.target.value)}/>
      <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
        <select style={{...S.sel,flex:1,minWidth:130}} value={fEst} onChange={e=>setFEst(e.target.value)}><option value="">Estatus: Todos</option>{EST.map(o=><option key={o} value={o}>{o}</option>)}</select>
        <select style={{...S.sel,flex:1,minWidth:130}} value={fTipo} onChange={e=>setFTipo(e.target.value)}><option value="">Tipo: Todos</option>{TIPO.map(o=><option key={o} value={o}>{o}</option>)}</select>
      </div>
      {lista.length===0&&<div style={{fontSize:11,color:"#475569",padding:"16px 0",textAlign:"center"}}>{bienes.length?"Sin inmuebles con ese filtro.":"Sin inmuebles registrados."}</div>}
      {lista.map(b=><div key={b.id} style={{...S.card(),marginBottom:8,cursor:"pointer"}} onClick={()=>abrir(b)}>
        <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:800,color:"#e2e8f0"}}>{b.denominacion}</div>
            <div style={{fontSize:10,color:"#64748b",marginTop:1}}>{b.tipo}{b.ubicacion?" · "+b.ubicacion:""}{b.superficie?" · "+b.superficie:""}</div>
          </div>
          <span style={S.tag(EST_COL[b.estatus]||"#64748b")}>{b.estatus}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginTop:6,gap:8}}>
          <div style={{fontSize:9,color:"#475569",minWidth:0,flex:1}}>{b.aliadoEstId?("Estr.: "+nomAliado(b.aliadoEstId)):""}{b.aliadoComId?(" · Com.: "+nomAliado(b.aliadoComId)):""}</div>
          <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:8,color:"#64748b"}}>Comisión proy.</div><div style={{fontSize:14,fontWeight:800,color:GOLD}}>{money(b.montoComision)}</div></div>
        </div>
      </div>)}
      <button style={{...S.saveB,marginTop:8}} onClick={()=>abrir(null)}>+ Nuevo inmueble</button>
    </div>
    {modal&&(()=>{const auto=calcCom(modal);return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}} onClick={()=>setModal(null)}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#0c0c16",border:"1px solid #1e293b",borderRadius:"16px 16px 0 0",padding:18,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{fontSize:14,fontWeight:800,color:GOLD,marginBottom:12}}>{modal.id?"Editar inmueble":"Nuevo inmueble"}</div>
        <Field label="Denominación"><input style={S.inp} value={modal.denominacion||""} onChange={e=>set("denominacion",e.target.value)}/></Field>
        <div style={S.g2}>
          <Field label="Estatus"><select style={S.sel} value={modal.estatus||"Disponible"} onChange={e=>set("estatus",e.target.value)}>{EST.map(o=><option key={o} value={o}>{o}</option>)}</select></Field>
          <Field label="Tipo"><select style={S.sel} value={modal.tipo||"Coinversión"} onChange={e=>set("tipo",e.target.value)}>{TIPO.map(o=><option key={o} value={o}>{o}</option>)}</select></Field>
        </div>
        <Field label="Descripción"><input style={S.inp} value={modal.descripcion||""} onChange={e=>set("descripcion",e.target.value)}/></Field>
        <Field label="Condiciones del escenario de negocio"><textarea style={S.ta} value={modal.condiciones||""} onChange={e=>set("condiciones",e.target.value)}/></Field>
        <Field label="Aliado Estratégico"><BuscaSelect opciones={aliadosOpts} value={modal.aliadoEstId} onChange={v=>set("aliadoEstId",v)} placeholder="— Selecciona aliado —" vacioLabel="— Ninguno —"/></Field>
        <Field label="Aliado Comercial"><BuscaSelect opciones={aliadosOpts} value={modal.aliadoComId} onChange={v=>set("aliadoComId",v)} placeholder="— Selecciona aliado —" vacioLabel="— Ninguno —"/></Field>
        <div style={S.g2}>
          <Field label="Valor de propiedad $"><input type="number" style={S.inp} value={modal.valorPropiedad||""} onChange={e=>set("valorPropiedad",e.target.value)}/></Field>
          <Field label="% Comisión propiedad"><input type="number" style={S.inp} value={modal.comProp||""} onChange={e=>set("comProp",e.target.value)}/></Field>
        </div>
        <div style={S.g2}>
          <Field label="Valor de inversión $"><input type="number" style={S.inp} value={modal.valorInversion||""} onChange={e=>set("valorInversion",e.target.value)}/></Field>
          <Field label="% Comisión inversión"><input type="number" style={S.inp} value={modal.comInv||""} onChange={e=>set("comInv",e.target.value)}/></Field>
        </div>
        <div style={{...S.card(),background:"#10101e",marginBottom:11}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
            <span style={{fontSize:10,color:"#64748b"}}>Monto de comisión proyectada</span>
            <button style={{...S.pill(modal.comAuto!==false,GOLD),padding:"4px 10px",fontSize:10}} onClick={()=>set("comAuto",!(modal.comAuto!==false))}>{modal.comAuto!==false?"Automático":"Manual"}</button>
          </div>
          {modal.comAuto!==false
            ? <div style={{fontSize:18,fontWeight:800,color:GOLD}}>{money(auto)}</div>
            : <input type="number" style={S.inp} value={modal.montoComision||""} onChange={e=>set("montoComision",e.target.value)} placeholder={String(Math.round(auto))}/>}
          <div style={{fontSize:8,color:"#475569",marginTop:4,lineHeight:1.4}}>Auto = Valor propiedad × %prop + Valor inversión × %inv. Cambia a Manual para ajustarlo.</div>
        </div>
        <Field label="Ubicación"><input style={S.inp} value={modal.ubicacion||""} onChange={e=>set("ubicacion",e.target.value)}/></Field>
        <Field label="Superficie"><input style={S.inp} value={modal.superficie||""} onChange={e=>set("superficie",e.target.value)} placeholder="Ej. 2.2 hectáreas"/></Field>
        <Field label="Observaciones"><textarea style={S.ta} value={modal.obs||""} onChange={e=>set("obs",e.target.value)}/></Field>
        <button style={S.saveB} onClick={guardar}>Guardar</button>
        {modal.id&&<button style={{...S.cancB,color:"#f87171",borderColor:"#f8717144"}} onClick={()=>borrar(modal.id)}>Eliminar</button>}
        <button style={S.cancB} onClick={()=>setModal(null)}>Cancelar</button>
      </div>
    </div>;})()}
  </div>;
}

function Configuracion({data,onRestore,onExcel,go}){
  const fileRef=useRef(null);
  const exportTotal=()=>{
    const payload={app:"Nexus CFC",tipo:"respaldo-total",version:1,fecha:new Date().toISOString(),data};
    const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="Nexus_CFC_respaldo_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    try{saveLS("lastFileBackup",new Date().toISOString());}catch(e){}
  };
  const onFile=(e)=>{
    const file=e.target.files&&e.target.files[0];if(!file){return;}
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        const d=p&&p.data?p.data:p;
        if(!d||typeof d!=="object"||!Array.isArray(d.contactos)){alert("El archivo no parece un respaldo válido de Nexus CFC.");e.target.value="";return;}
        const resumen="Esto REEMPLAZARÁ todo el contenido actual por el del respaldo:\n\n"
          +"• "+(d.contactos||[]).length+" contactos\n"
          +"• "+(d.empresas||[]).length+" empresas\n"
          +"• "+(d.actividades||[]).length+" actividades\n"
          +"• "+(d.oportunidades||[]).length+" oportunidades\n"
          +"• "+(d.productos||[]).length+" productos\n"
          +"• "+(d.bienes||[]).length+" bienes inmuebles\n"
          +"• "+(d.catalogos?Object.keys(d.catalogos).length:0)+" catálogos\n\n¿Continuar?";
        if(window.confirm(resumen)){onRestore(d);alert("Respaldo recuperado. El contenido quedó idéntico al del archivo.");}
      }catch(err){alert("No se pudo leer el archivo: "+err.message);}
      e.target.value="";
    };
    r.readAsText(file);
  };
  return <div>
    <div style={S.hdr}><div><div style={S.logo}>Configuración</div><div style={S.sub}>Módulos, personalización, seguridad y exportar</div></div></div>
    <div style={S.line}/>
    <div style={{...S.sec,paddingTop:10}}>

      {/* ── 1. MÓDULOS BASE ── */}
      <div style={S.sTit}>🗂 MÓDULOS BASE</div>
      {[["catalogos","☰","Catálogos","Listas y valores del sistema"],
        ["productos","📦","Productos por solución","Base de Oportunidades y Metas"],
        ["aliados","🤝","Aliados","Estratégicos y comerciales"],
        ["bienes","🏠","Bienes Inmuebles","Propiedades para venta o coinversión"]].map(a=>
        <div key={a[0]} style={{...S.cCard(GOLD),display:"flex",alignItems:"center",gap:12,marginBottom:9}} onClick={()=>go(a[0])}>
          <span style={{fontSize:20}}>{a[1]}</span>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{a[2]}</div><div style={{fontSize:10,color:"#64748b"}}>{a[3]}</div></div>
          <span style={{color:"#64748b"}}>›</span>
        </div>)}

      {/* ── 2. PERSONALIZACIÓN ── */}
      <div style={{...S.sTit,marginTop:6}}>🎨 PERSONALIZACIÓN</div>
      <div style={{...S.cCard("#475569"),marginBottom:9}}>
        <div style={{fontSize:10,color:"#64748b",lineHeight:1.5}}>Los catálogos y módulos del sistema se configuran en la sección <span style={{color:GOLD,fontWeight:700}}>Módulos Base</span> de arriba.</div>
      </div>

      {/* ── 3. SEGURIDAD ── */}
      <div style={S.sTit}>🔒 SEGURIDAD</div>
      <div style={{...S.cCard("#475569"),marginBottom:9}}>
        <div style={{fontSize:10,color:"#475569",lineHeight:1.5}}>La seguridad (PIN y bloqueo automático) se gestiona desde el shell de <span style={{color:GOLD,fontWeight:700}}>Nexus Flow</span>, que protege todas las apps con un único punto de acceso.</div>
      </div>

      {/* ── 4. EXPORTAR ── */}
      <div style={S.sTit}>📥 EXPORTAR</div>
      <div style={{...S.cCard("#22c55e33"),marginBottom:9,cursor:"pointer"}} onClick={onExcel}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:20}}>📥</span>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:700}}>Exportar a Excel</div>
            <div style={{fontSize:10,color:"#64748b"}}>Descarga contactos, empresas y oportunidades en Excel para análisis avanzado</div>
          </div>
          <span style={{color:"#64748b"}}>›</span>
        </div>
      </div>
      <div style={{...S.infoBx("#475569"),marginBottom:13}}><span>ℹ</span><span>Los respaldos JSON se gestionan desde Nexus Flow (shell principal).</span></div>
      <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={onFile}/>
    </div>
  </div>;
}

function PipelineProspeccion({contactos,oportunidades,catalogos,productos}){
  const[mes,setMes]=useState(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");});
  const[modo,setModo]=useState("meta"); // "todas" | "ancladas" | "meta"
  const[etapaExpP,setEtapaExpP]=useState(null);
  const[expandTag,setExpandTag]=useState({}); // {solId_tipo: bool}
  const toggleTag=(key)=>setExpandTag(p=>({...p,[key]:!p[key]}));
  // Funnel global
  const FUNNEL=["Candidato","Contacto","Prospecto","Cliente"].map(et=>({
    label:et, n:contactos.filter(c=>c.etapaPrincipal===et).length, color:ec(et), prin:et
  }));
  const maxF=Math.max(...FUNNEL.map(f=>f.n),1);
  // Filas por solución según modo
  const allRows=(catalogos.solucion||[]).map(s=>{
    const prods=(productos||[]).filter(p=>p.solucionId===s.id&&Number((p.metas||{})[mes])>0);
    const metaUnid=prods.reduce((t,p)=>t+Number((p.metas||{})[mes]),0);
    const opps=(oportunidades||[]).filter(o=>ABIERTA(o)&&o.solucionId===s.id);
    const ctosAnc=contactos.filter(c=>{if(!(c.solucionesAncla||[]).includes(s.id))return false;const ep=c.etapaPrincipal,ee=c.etapaEspecifica||"";return ["Contacto","Prospecto"].includes(ep)||["Cliente Cerrado en Reproceso","Cliente Activo en Reproceso"].includes(ee);});
    const candAnc=contactos.filter(c=>c.etapaEspecifica==="Candidato en Proceso"&&(c.solucionesAncla||[]).includes(s.id));
    const reprocesoAnc=contactos.filter(c=>["Cliente Cerrado en Reproceso","Cliente Activo en Reproceso"].includes(c.etapaEspecifica)&&(c.solucionesAncla||[]).includes(s.id));
    const esAnclada=!!(catalogos.solucion||[]).find(x=>x.id===s.id)?.ancla;
    if(!reprocesoAnc.length&&!prods.length&&!opps.length&&!ctosAnc.length&&!candAnc.length)return null;
    return{s,metaUnid,opps,ctosAnc,candAnc,reprocesoAnc,esAnclada,hasMeta:prods.length>0};
  });
  const pipeRows=allRows.filter(Boolean).filter(r=>{
    if(modo==="meta")return r.hasMeta;
    if(modo==="ancladas")return r.esAnclada;
    return true;
  });
  return <div style={S.sec}>
    <div style={S.card()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={S.sTit}>Embudo de Prospección</div>
        <input type="month" value={mes} onChange={e=>setMes(e.target.value)} style={{background:"#13131f",border:"1px solid #1e293b",borderRadius:8,padding:"3px 7px",color:"#e2e8f0",fontSize:10,outline:"none"}}/>
      </div>
      {/* Embudo interactivo igual que Dashboard */}
      <div style={{marginBottom:12}}>
        {FUNNEL.map(({label,n,color,prin})=>{
          const key=prin;const isExp=etapaExpP===key;
          const subEtapas=(catalogos.etapaEspecifica||[]).filter(e=>e.principal===prin);
          return <div key={key} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:2,cursor:subEtapas.length?"pointer":"default"}} onClick={()=>subEtapas.length&&setEtapaExpP(isExp?null:key)}>
              <span style={{color:"#94a3b8"}}>{label}{subEtapas.length?<span style={{color:"#475569",fontSize:9}}> {isExp?"▲":"▾"}</span>:""}</span>
              <span style={{color,fontWeight:700}}>{n}</span>
            </div>
            <div style={{height:4,background:"#1a1a2e",borderRadius:3}}><div style={{height:"100%",width:Math.round(n/maxF*100)+"%",background:color,borderRadius:3}}/></div>
            {isExp&&<div style={{marginTop:6,paddingLeft:10,borderLeft:`2px solid ${color}44`}}>
              {subEtapas.map(se=>{const ns=contactos.filter(c=>c.etapaEspecifica===se.nombre).length;if(!ns)return null;
                return <div key={se.id} style={{marginBottom:5}}><div style={{display:"flex",justifyContent:"space-between",fontSize:9,marginBottom:1}}><span style={{color:"#64748b"}}>{se.nombre}</span><span style={{color,fontWeight:600}}>{ns}</span></div><div style={{height:3,background:"#1a1a2e",borderRadius:3}}><div style={{height:"100%",width:Math.round(ns/n*100)+"%",background:color+"99",borderRadius:3}}/></div></div>;
              })}
            </div>}
          </div>;
        })}
      </div>
      {/* Filtros de modo */}
      <div style={{display:"flex",gap:5,marginBottom:10}}>
        {[["meta","🎯 Con meta","#fbbf24"],["ancladas","⭐ Ancladas","#C9A84C"],["todas","Todas","#64748b"]].map(([v,l,c])=>(
          <span key={v} style={{...S.chip(modo===v,c),fontSize:9,padding:"3px 8px",cursor:"pointer",flex:1,textAlign:"center"}} onClick={()=>setModo(v)}>{l}</span>
        ))}
      </div>
      <div style={{fontSize:9,color:"#475569",fontWeight:700,letterSpacing:.5,textTransform:"uppercase",marginBottom:8}}>Por Solución — {mes.split("-").reverse().join("/")}</div>
      {pipeRows.length===0&&<div style={{fontSize:10,color:"#475569",textAlign:"center",padding:"10px 0"}}>Sin soluciones para el filtro seleccionado</div>}
      {pipeRows.map(({s,metaUnid,opps,ctosAnc,candAnc,reprocesoAnc,esAnclada})=>{
        const kO=s.id+"_opps",kC=s.id+"_ctos",kP=s.id+"_cand";
        return <div key={s.id} style={{padding:"10px 0",borderTop:"1px solid #1e293b"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#e2e8f0",marginBottom:6}}>{esAnclada?"⭐ ":""}{s.nombre}</div>
          {(()=>{
            const OPO_RANK={"Propuesta Presentada":0,"Oportunidad en Preparación":1,"Oportunidad Identificada":2};
            const PROB_RANK={"Muy Alta":0,"Alta":1,"Media":2,"Baja":3};
            const EXCLUIR=["Oportunidad Aceptada","Oportunidad Concretada","Oportunidad Liquidada","Oportunidad Rechazada"];
            const oppsVis=opps.filter(o=>!EXCLUIR.includes(o.etapa)&&!((o.etapa||"").toLowerCase().includes("espera")))
              .sort((a,b)=>{let r=(OPO_RANK[a.etapa]??9)-(OPO_RANK[b.etapa]??9);if(r===0)r=(a.fechaEstimadaCierre||"9999").localeCompare(b.fechaEstimadaCierre||"9999");if(r===0)r=(PROB_RANK[a.probabilidad]??9)-(PROB_RANK[b.probabilidad]??9);return r;});
            const CTOS_RANK={"Cliente Activo en Reproceso":0,"Cliente Cerrado en Reproceso":1,"Oportunidad Activa":2,"Encuentro Concretado":3,"Encuentro Programado":4,"Encuentro Inicial Previo":5,"Contacto en Avance":6,"Contacto":7};
            const ctosOrd=[...ctosAnc].sort((a,b)=>(CTOS_RANK[a.etapaEspecifica]??9)-(CTOS_RANK[b.etapaEspecifica]??9));
            return <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {metaUnid>0&&<span style={{...S.tag(GOLD),fontSize:9}}>🎯 Meta: {metaUnid} u.</span>}
              <span style={{...S.chip(expandTag[kO],"#60a5fa"),fontSize:9,padding:"3px 8px",cursor:"pointer"}} onClick={()=>toggleTag(kO)}>🚀 {oppsVis.length} oportunidad{oppsVis.length!==1?"es":""}</span>
              {ctosAnc.length>0&&<span style={{...S.chip(expandTag[kC],"#a78bfa"),fontSize:9,padding:"3px 8px",cursor:"pointer"}} onClick={()=>toggleTag(kC)}>👤 {ctosAnc.length} contacto{ctosAnc.length!==1?"s":""}</span>}
              {candAnc.length>0&&<span style={{...S.chip(expandTag[kP],"#60a5fa"),fontSize:9,padding:"3px 8px",cursor:"pointer"}} onClick={()=>toggleTag(kP)}>⏳ {candAnc.length} en proceso</span>}
              {metaUnid>0&&oppsVis.length<metaUnid&&<span style={{...S.tag("#f87171"),fontSize:9}}>⚠ Faltan {metaUnid-oppsVis.length}</span>}
              {expandTag[kO]&&<div style={{width:"100%",marginTop:6,paddingLeft:8,borderLeft:"2px solid #60a5fa44"}}>
                {oppsVis.length===0?<div style={{fontSize:10,color:"#475569"}}>Sin oportunidades en pipeline</div>:oppsVis.map(o=><div key={o.id} style={{padding:"4px 0",borderBottom:"1px solid #0f172a"}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#e2e8f0"}}>{o.concepto}</div>
                  <div style={{fontSize:9,color:"#64748b"}}>{(o.etapa||"").replace("Oportunidad ","")} {o.fechaEstimadaCierre?" · "+o.fechaEstimadaCierre.split("-").reverse().join("/"):""}{o.probabilidad?" · "+o.probabilidad:""}</div>
                </div>)}
              </div>}
              {expandTag[kC]&&<div style={{width:"100%",marginTop:6,paddingLeft:8,borderLeft:"2px solid #a78bfa44"}}>
                {ctosOrd.map(c=><div key={c.id} style={{padding:"4px 0",borderBottom:"1px solid #0f172a"}}>
                  <div style={{fontSize:11,color:"#e2e8f0"}}>{nombreDisplay(c)}</div>
                  <div style={{fontSize:9,color:["Cliente Activo en Reproceso","Cliente Cerrado en Reproceso"].includes(c.etapaEspecifica)?"#f97316":"#64748b"}}>{c.etapaEspecifica||c.etapaPrincipal}</div>
                </div>)}

function ObjetivoMes({productos,oportunidades,catalogos}){

const proyFecha=(a)=>{if(a.modoTarea!=="proyecto"||!(a.subtareas||[]).length)return a.fecha||"";const pend=(a.subtareas||[]).filter(s=>s.estatus!=="Cerrada");const ds=pend.map(s=>s.fecha).filter(Boolean).sort();return ds[0]||(a.subtareas||[]).map(s=>s.fecha).filter(Boolean).sort()[0]||"";};
const proyEstatus=(a)=>{if((a.modoTarea==="proyecto"||a.modoTarea==="checklist")&&a.cierreForzado)return "Cerrada";if(a.modoTarea==="proyecto"&&(a.subtareas||[]).length){const sts=(a.subtareas||[]).map(s=>s.estatus||"Programada");if(sts.every(s=>s==="Cerrada"))return "Cerrada";if(sts.some(s=>s==="En Proceso"||s==="Cerrada"))return "En Proceso";return "Programada";}if(a.modoTarea==="checklist"&&(a.items||[]).length){const done=(a.items||[]).filter(i=>i.done).length;if(done===(a.items||[]).length)return "Cerrada";if(done>0)return "En Proceso";return "Programada";}return a.estatus||"Programada";};
const proyPrioridad=(a)=>{if(a.modoTarea!=="proyecto"||(!(a.subtareas||[]).length))return a.prioridad||"Media";const rank={"Muy Alta":0,"Alta":1,"Media":2,"Baja":3};let best=3;(a.subtareas||[]).forEach(s=>{const r=rank[s.prioridad||"Media"];if(r<best)best=r;});return Object.keys(rank).find(k=>rank[k]===best)||"Media";};

/* Aplica un patch a una actividad; si cambia el estatus de un checklist/proyecto, mantiene coherente el flag cierreForzado */
const aplicaPatchAct=(a,p)=>{const r={...a,...p};if(p&&p.estatus!==undefined&&p.cierreForzado===undefined&&(a.modoTarea==="checklist"||a.modoTarea==="proyecto")){if(p.estatus==="Cerrada"){const its=a.modoTarea==="checklist"?(r.items||[]).map(x=>!!x.done):(r.subtareas||[]).map(x=>x.estatus==="Cerrada");r.cierreForzado=its.length>0&&!its.every(Boolean);}else r.cierreForzado=false;}return r;};

function BuscaCtoEmpCFC({contactos,empresas,value,onChange,placeholder,onAdd}){

  const empName=(c)=>{const ids=getEmpIds(c);const e=ids[0]&&empresas.find(x=>x.id===ids[0]);return e?e.nombre:"";};
  const results=useMemo(()=>{
    if(q.trim().length<2)return[];
    const ql=q.toLowerCase();const items=[];const addedEmp=new Set();

      {results.map((r,i)=><div key={i} style={{padding:"10px 13px",borderBottom:"1px solid #0f172a",cursor:"pointer"}} onClick={()=>{onChange(r.id);setQ("");setOpen(false);}}>
        <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>{r.kind==="emp"?"🏢":"👤"} {r.label}</div>
        {r.sub&&<div style={{fontSize:10,color:"#475569",marginTop:2}}>{r.sub}</div>}
      </div>)}
    </div>}
    {open&&q.trim().length>=2&&results.length===0&&<div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:400,background:"#0d0d1a",border:"1px solid #1e293b",borderRadius:10,padding:12,marginTop:4,fontSize:11,color:"#475569"}}>Sin coincidencias.{onAdd&&<span style={{color:"#2dd4bf",cursor:"pointer"}} onClick={()=>onAdd(q)}> + Crear "{q}"</span>}</div>}
  </div>;
}
